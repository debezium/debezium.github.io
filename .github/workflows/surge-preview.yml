name: Surge.sh Preview

on:
  # Runs with a write token and the Surge secret: never check out or run pull request code, and treat artifacts
  # and pull request metadata as untrusted.
  workflow_run:
    workflows: ["Receive PR"]
    types:
      - requested
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  start:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.action == 'requested'
    steps:
      # The PR artifact does not exist yet, so look up the open pull request whose head is the triggering commit
      - name: find PR id
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Error: invalid head commit"
            exit 1
          fi
          PR_ID=$(gh api -X GET "repos/$GH_REPO/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" \
            --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number" | head -n 1)
          if [[ -z "$PR_ID" ]]; then
            echo "No open pull request found for $HEAD_SHA, nothing to do."
          elif ! [[ "$PR_ID" =~ ^[0-9]+$ ]]; then
            echo "Error: invalid PR number"
            exit 1
          fi
          echo "id=$PR_ID" >> $GITHUB_OUTPUT

      - name: create status comment
        if: steps.pr.outputs.id != ''
        uses: marocchino/sticky-pull-request-comment@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          header: surge-preview
          number: ${{ steps.pr.outputs.id }}
          message: |
            ⚡️ Deploying PR Preview...
            <img src="https://user-images.githubusercontent.com/507615/90240294-8d2abd00-de5b-11ea-8140-4840a0b2d571.gif" width="300" />

  success:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: download pr artifact
        uses: dawidd6/action-download-artifact@v20
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: pr
          allow_forks: true

      - name: save PR id
        id: pr
        run: |
          PR_ID=$(cat pr-id.txt | tr -d '\n')
          if ! [[ "$PR_ID" =~ ^[0-9]+$ ]]; then
            echo "Error: pr-id.txt contains invalid PR number"
            exit 1
          fi
          echo "id=$PR_ID" >> $GITHUB_OUTPUT

      - name: download dist artifact
        uses: dawidd6/action-download-artifact@v20
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: dist
          allow_forks: true

      - name: upload surge service
        id: deploy
        run: |
          export DEPLOY_DOMAIN=https://debezium-debezium-github-io-preview-pr-${{ steps.pr.outputs.id }}.surge.sh
          npx surge --project ./ --domain $DEPLOY_DOMAIN --token ${{ secrets.SURGE_TOKEN }}
      - name: update status comment
        uses: marocchino/sticky-pull-request-comment@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          header: surge-preview
          number: ${{ steps.pr.outputs.id }}
          message: |
            🎊 PR Preview has been successfully built and deployed to https://debezium-debezium-github-io-preview-pr-${{ steps.pr.outputs.id }}.surge.sh

            <img width="300" src="https://user-images.githubusercontent.com/507615/90250366-88233900-de6e-11ea-95a5-84f0762ffd39.png">

      - name: The job failed
        if: ${{ failure() }}
        uses: marocchino/sticky-pull-request-comment@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          header: surge-preview
          number: ${{ steps.pr.outputs.id }}
          message: |
            😭 Deploy PR Preview failed.
            <img width="300" src="https://user-images.githubusercontent.com/507615/90250824-4e066700-de6f-11ea-8230-600ecc3d6a6b.png">

  failed:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: download pr artifact
        uses: dawidd6/action-download-artifact@v20
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: pr
          allow_forks: true

      - name: save PR id
        id: pr
        run: |
          PR_ID=$(cat pr-id.txt | tr -d '\n')
          if ! [[ "$PR_ID" =~ ^[0-9]+$ ]]; then
            echo "Error: pr-id.txt contains invalid PR number"
            exit 1
          fi
          echo "id=$PR_ID" >> $GITHUB_OUTPUT

      - name: The job failed
        uses: marocchino/sticky-pull-request-comment@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          header: surge-preview
          number: ${{ steps.pr.outputs.id }}
          message: |
            😭 Deploy PR Preview failed.
            <img width="300" src="https://user-images.githubusercontent.com/507615/90250824-4e066700-de6f-11ea-8230-600ecc3d6a6b.png">
