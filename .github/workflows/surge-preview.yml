name: Surge.sh Preview

on:
  workflow_run:
    workflows: ["Receive PR"]
    types:
      - completed
      
jobs:
  success:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: download pr artifact
        uses: dawidd6/action-download-artifact@v20
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          name: pr
          allow_forks: true

      - name: print PR id
        id: print-pr
        run: "cat pr-id.txt"

      - name: save PR id
        id: pr
        run: echo "id=$(<pr-id.txt)" >> $GITHUB_OUTPUT

      - name: download dist artifact
        uses: dawidd6/action-download-artifact@v20
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          workflow_conclusion: success
          name: dist
          allow_forks: true

      - name: upload surge service
        id: deploy
        run: |
          export DEPLOY_DOMAIN=https://debezium-debezium-github-io-preview-pr-${{ steps.pr.outputs.id }}.surge.sh
          npx surge --project ./ --domain $DEPLOY_DOMAIN --token ${{ secrets.SURGE_TOKEN }}
      - name: update status comment
        uses: marocchino/sticky-pull-request-comment@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          header: surge-preview
          number: ${{ steps.pr.outputs.id }}
          message: |
            🎊 PR Preview has been successfully built and deployed to https://debezium-debezium-github-io-preview-pr-${{ steps.pr.outputs.id }}.surge.sh

            <img width="300" src="https://user-images.githubusercontent.com/507615/90250366-88233900-de6e-11ea-95a5-84f0762ffd39.png">

      - name: The job failed
        if: ${{ failure() }}
        uses: marocchino/sticky-pull-request-comment@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          header: surge-preview
          number: ${{ steps.pr.outputs.id }}
          message: |
            😭 Deploy PR Preview failed.
            <img width="300" src="https://user-images.githubusercontent.com/507615/90250824-4e066700-de6f-11ea-8230-600ecc3d6a6b.png">

  failed:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: download pr artifact
        uses: dawidd6/action-download-artifact@v20
        with:
          workflow: ${{ github.event.workflow_run.workflow_id }}
          name: pr
          allow_forks: true

      - name: save PR id
        id: pr
        run: echo "id=$(<pr-id.txt)" >> $GITHUB_OUTPUT

      - name: The job failed
        uses: marocchino/sticky-pull-request-comment@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          header: surge-preview
          number: ${{ steps.pr.outputs.id }}
          message: |
            😭 Deploy PR Preview failed.
            <img width="300" src="https://user-images.githubusercontent.com/507615/90250824-4e066700-de6f-11ea-8230-600ecc3d6a6b.png">
