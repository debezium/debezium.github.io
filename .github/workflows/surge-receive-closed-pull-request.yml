name: Receive Closed PR

# Only records the closed pull request number; the preview is torn down by surge_preview_teardown.yml,
# which runs on workflow_run and has access to the Surge secret.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  save-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        env:
          PR_NUM: ${{ github.event.number }}
        run: |
          if ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "Error: Invalid PR number"
            exit 1
          fi
          echo "$PR_NUM" > ./pr-id.txt

      - name: Upload PR number
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: ./pr-id.txt
          retention-days: 1
