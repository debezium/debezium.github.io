summary: Version 3.3 release stream
version: "3.3"
overview: CockroachDB connector; Quarkus extension support for heartbeats, deserializers, custom converters and post-processors; Exactly-once delivery enabled for all connectors; Support for Oracle read-only replicas
displayed: true
hidden: false
tutorial: true
connectors:
  - mysql
  - mariadb
  - mongodb
  - postgres
  - oracle
  - sqlserver
  - cassandra-3
  - cassandra-4
  - db2
  - spanner
  - vitess
  - jdbc
  - informix
  - ibmi
  - cockroachdb
compatibility:
  java:
    version: 17+ for connectors; 21+ for Debezium Server, Operator, Outbox and Quarkus extension
  connect:
    version: 3.1 and later
  mysql:
    database:
      versions:
        - 8.0.x
        - 8.4.x
        - 9.0
        - 9.1
    driver:
      versions:
        - 9.1.0
  mariadb:
    database:
      versions:
        - 11.4.x
    driver:
      versions:
        - 3.5.3
  mongodb:
    database:
      versions:
        - 6.0
        - 7.0
        - 8.0
    driver:
      versions:
        - 4.11.0
  postgresql:
    database:
      versions:
        - 12
        - 13
        - 14
        - 15
        - 16
        - 17
      plugins:
        - decoderbufs
        - pgoutput
    driver:
      versions:
        - 42.7.7
  sqlserver:
    database:
      versions:
        - 2017
        - 2019
        - 2022
    driver:
      versions:
        - 12.4.2.jre8
  oracle:
    database:
      versions:
        - 19c
        - 21c
        - 23ai (LogMiner only)
    driver:
      versions:
        - 19.x
        - 21.x
        - 23.x (with 23ai only)
    olr:
      versions:
        - 1.6.0
        - 1.5.0
        - 1.4.0
        - 1.3.0
  cassandra-3:
    database:
      versions:
        - 3.11.12
    driver:
      versions:
        - 3.11.12
  cassandra-4:
    database:
      versions:
        - 4.1.7
    driver:
      versions:
        - 4.14.0
  cassandra-5:
    database:
      versions:
        - 5.0.2
    driver:
      versions:
        - 4.14.0
  db2:
    database:
      versions:
        - 11.5
    driver:
      versions:
        - 11.5.0.0
  spanner:
    database:
      versions:
        - 6.x
    driver:
      versions:
        - 6.x
  vitess:
    database:
      versions:
        - 12.0.x
    driver:
      versions:
        - 21.0.2*
    note: See the Vitess Connector <a href="/documentation/reference/2.0/connectors/vitess.html#limitations-with-earlier-vitess-versions">documentation</a> for limitations when using the connector with earlier Vitess versions
  jdbc:
    databases:
      - Db2
      - MySQL
      - Oracle
      - PostgreSQL
      - SQL Server
  informix:
    database:
      versions:
        - 12
        - 14
        - 15
    driver:
      versions:
        - 4.50.12
  ibmi:
    database:
      versions:
        - 7.4
    driver:
      versions:
        - 11.1
  cockroachdb:
    database:
      versions:
        - 25.2.3
    driver:
      versions:
        - 42.7.7
