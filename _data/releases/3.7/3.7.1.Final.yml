date: 2026-11-06
version: "3.7.1.Final"
stable: true
summary: "Allow ReselectColumnsPostProcessor to query Oracle secondary; Fix Oracle snapshot retries for ORA-01466; Fix MySQL connector skipping rows after restart when XA transactions are used; Fix MySQL connector resuming from an offset without a GTID set when the server uses GTIDs; Fix PostgreSQL changes lost on restart when lsn_events_processed is 1 or the offset is stored at a transactional logical message; Fix Oracle LogMiner on RAC silently skipping change events at a capped log boundary SCN; Fix Oracle XStream task failure after restart; Fix SQL Server incremental snapshot duplicating or dropping rows for datetime primary keys; Fix SQL Server schema history recovery skipping changes when the stored offset has a NULL change_lsn; Fix SQL Server datetime2 values shifted forward during spring-forward daylight savings; Fix PostgreSQL snapshot throughput regression on timestamp/timestamptz columns; Fix PostgreSQL infinity date inconsistencies across snapshot, pgoutput, and decoderbufs; Fix Cassandra 5 CDC real-time processing and NullPointerException/IndexOutOfBoundsException failures on table and keyspace changes; Restore Apicurio converter/serde in the Debezium Server and JVM distributions and fix SMT NoClassDefFoundError for SmtManager; Fix Debezium Server ignoring external connector.class and not exiting after engine failure; Fix JDBC sink ClassCastException with primitive record keys and connection.pool.timeout being read as milliseconds; Fix Outbox Event Router handling of failed JSON payload expansion and dropped W3C baggage; Fix MySQL ALTER COLUMN SET DEFAULT NULL producing non-null schema defaults and DDL parser dropping scale for Oracle NUMBER(*,s) columns; Fix incremental snapshot state leaking from an aborted snapshot to the next; Fix MongoDB connection string masking leaving percent-encoded credentials exposed in logs; Bump MariaDB Connector/J to 3.5.11 and MySQL Connector/J to 26.10.0 to address CVEs"
#announcement_url:
