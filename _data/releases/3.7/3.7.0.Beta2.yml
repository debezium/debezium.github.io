summary: "Official release of RocksDB and sqlite connectors and Debezim CLI; RocksDB cache for ReselectColumnsPostProcessor; Embeddings SMT extension for OpenAI models; TLS/mTLS support for RabbitMQ Stream sink; Optimization of JMX LastEvent metric rendering with JsonStringEncoder for up to +47% snapshot throughput; Fix for MySQL binlog position computation beyond 32-bit log_pos; Alerting support and table explorer for incremental snapshots in Debezium Platform; SingleStore ARRAY to JSON mapping support in JDBC sink; Date type key support in MongoDB incremental snapshots; Fix for Oracle savepoint partial rollbacks with LOB columns; Fix for SQL Server direct mode data loss on updates with fetch size greater than zero; Hardening and fail safety improvements for Neo4j source SMT; gRPC channel leak and zero-day DATETIME handling fixes in Vitess connector; Prevention of stale connections when TCP remains established but MySQL session dies; PostgreSQL NullPointerException fix for enums without values; Removal of the incubating designation from the CockroachDB connector"
