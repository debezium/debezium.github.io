date: 2026-07-30
version: "3.7.0.Alpha1"
stable: false
summary: Incubating Ingres connector; JMX metrics for JDBC connector; Spanner placement tables support; CockroachDB configurable changefeed strategy and dialect for JDBC sink; SingleStore and Starrocks support in JDBC sink; Quarkus Extension for Debezium Server; Shutdown strategies in Debezium Engine; Schema history memory optimization; DB2 change table prune; Downstream mining across all Oracle adapters; Oracle ROWID surrogate key sorting; PostgreSQL geometric types mapping and performance improvements; ExtendedTimestamp for high-precision timestamps; SNS/SQS MessageGroupId support; JDBC sink fail-fast option; CREATE TABLE LIKE syntax support; Incremental snapshot watermark attribution; Performance improvements in chunked snapshots and BoundedConcurrentHashMap; CockroachDB kafka_sink_config option
announcement_url: /blog/2026/07/30/debezium-3-7-alpha1-released/
