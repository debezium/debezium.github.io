date: 2026-09-22
version: "3.7.0.CR1"
stable: false
summary: "Oracle LogMiner total abandoned transaction count JMX metrics; Signal to dump current transaction state to connector logs; ORA-02002 added to retriable exceptions; MongoDB read preference honored in change streams after promotion; Evaluation window custom time input in alert rule creation; Fix MySQL connector silent row loss after keepalive reconnect under backpressure; Fix MySQL/MariaDB error handlers treating all errors as non-retriable; Fix handling of zero-year dates in MySQL; Fix SQL Server arithmetic overflow on tables exceeding 2.14B rows during parallel chunked snapshot; Fix JDBC sink UNNEST batch writes on multiple events for the same primary key; Fix Oracle Standby connector skipping events after DDL changes; Support Oracle CREATE INDEX ONLINE DDL parsing; Support Oracle XMLTYPE with SCHEMA in parser; Fix Cassandra 5 CDC NullPointerException on ALTER TABLE; Fix MongoDB startup validation rejecting valid split-event resume tokens; Fix ExtractChangedRecordState false positives on unchanged binary fields and schema evolution DataException; Move last enqueued event map to transaction cache; PyDebeziumAI real-time CDC integration for LangChain and LangGraph; Milvus source connector wire format detection and snapshot consistency"
announcement_url: /blog/2026/09/22/debezium-3-7-cr1-released/
