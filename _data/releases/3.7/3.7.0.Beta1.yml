date: 2026-08-26
version: "3.7.0.Beta1"
stable: false
summary: Incremental snapshots on PostgreSQL read-only replicas; Oracle BC timestamp and negative timestamp (-infinity) support; MySQL NOBLOB binlog_row_image format support; Databricks ZeroBus Ingest sink with acknowledgment-safe offset handling for Debezium Server; Kinesis sink IRSA/WebIdentityToken support; Adaptive polling and pipeline designer connection handling in Debezium Platform UI; Pipeline failure label fix in Debezium Platform; debezium validate enhanced with connector-native config validation; Emit schema and table in source info block; Kafka upgraded to 4.3.1
