date: 2026-09-29
version: "3.7.0.Final"
stable: true
summary: "New dedicated SMT to convert MongoDB events into relational-style structs; Lossless handling mode for MongoDB BSON Timestamp values; Fixed TimescaleDB transform compatibility with Timescale 2.29 and dropped-chunk topic routing; Introduced `modify_to_partitioned` Oracle DDL rule; Vitess connector exposes `vitess.cells` to pin VStream to specific cells; Debezium Server Kafka sink now respects SMT-selected partitions; Fixed SignalProcessor.executeWithSemaphore running critical section unguarded on timeout; Fixed MariaDB EventBuffer dropping standalone DDL GTID events with binlog.buffer.size enabled; Fixed inconsistent epoch scaling and invalid negative year in PostgreSQL date/timestamp infinity constants; Fixed MongoDB ExtractNewDocumentState omitting fields removed by $unset instead of emitting null; Fixed PostgreSQL JDBC sink binding of ARRAY<BYTES> to bytea[] and serialization of ARRAY<STRUCT> fields as JSONB; Fixed MySQL TIME column 00:00:00 emitted as null during snapshot; Fixed SQL Server unavailable.value.placeholder incorrectly applied to max and nvarchar(max) columns; Fixed Oracle physical standby always using CURRENT_SCN for upper boundary and LogMiner mining window falling below minimum log count; Fixed MySQL snapshot leaking lock-heartbeat threads on task restart; Fixed PartitionRouting NPE when nested field path traverses a null struct; Fixed Oracle DDL parse failures for materialized views and USERENV parameter on Oracle 12; Fixed Strings.mask ignoring mask argument and failing to mask credentials in connection strings; Added captured tables to initial snapshot notifications and new HTTP notification channel; Updated Hibernate to 7.4.10.Final and addressed Debezium Server CVE findings"
#announcement_url:
