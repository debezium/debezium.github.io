date: 2026-11-10
version: "3.6.4.Final"
stable: true
summary: "Confluent Maven repository moved behind an opt-in profile; Oracle LogMiner query optimized by removing concatenation and the UPPER function; Schema history no longer wrongly restricted by snapshot.include.collection.list; Validation added that tasks.min must be <= tasks.max; Fixed concatenated XML in one Kafka message; SignalProcessor now respects the tryAcquire result and no longer runs the critical section unguarded on timeout; JdbcSchemaHistory now commits open transactions on read paths; MySQL TIME value 00:00:00 is now emitted as 0 instead of null during initial snapshot; Oracle parser now supports XMLTYPE with SCHEMA and fixes DDL parse failures for materialized views and relaxed quote DML regression; Oracle LogMiner on RAC no longer skips change events at capped log boundary SCNs or in CLOSED redo threads; Oracle physical standby and ORA-02003 USERENV issue on Oracle 12 fixed; Oracle heartbeat JDBC connection now keeps its PDB container after reconnect and XStream tasks no longer fail after restart; Buffered LogMiner transactions are reread so late LOB/XML rows are not lost; SQL Server arithmetic overflow on tables over 2.14B rows during parallel chunked snapshot fixed and retriable task startup failures now clean up resources; JDBC sink connection.pool.timeout now correctly interpreted as seconds; PartitionRouting no longer throws NullPointerException on null nested structs and CloudEventsConverter initialization failure fixed; Connector configuration property descriptions corrected; Dependency updates including Hibernate 7.4.10.Final, MySQL Connector/J 26.10.0 (CVE-2025-30706) and MongoDB driver 5.14.x"
#announcement_url:
