date: 2026-09-01
version: "3.6.2.Final"
stable: true
summary: "Incremental snapshot support added for PostgreSQL read-only replicas; BoundedConcurrentHashMap batch eviction fixed to prevent O(n) queue size calls on put-heavy workloads; Debezium Server logging now masks passwords to prevent credential exposure; JDBC storage RetriableConnection fixed to honor max.retries instead of retrying forever; PostgreSQL parallel snapshot pooled connections now pinned to exported snapshot for consistent reads; JDBC sink now emits OVERRIDING SYSTEM VALUE for PostgreSQL GENERATED ALWAYS AS IDENTITY primary keys; MySQL DDL parser fixed to accept unquoted `url` identifier on MySQL 8.0.32+ and to support executable comments; Oracle DDL parser fixed for ALTER TABLE ADD with column and constraint, and for ALTER RANGE PARTITION with Index-Clause; SQL Server unavailable.value.placeholder now applies to varchar(max), nvarchar(max), and varbinary(max) columns; PostgreSQL read.only=true fixed to avoid calling pg_current_xact_id() on hot standby; Incremental snapshot fixed to prevent silent data loss on NUMERIC keys holding NaN or Infinity; MySQL incremental snapshot no longer breaks after a server-side connection close; MathOps.add fixed for BigInteger overloads so Document.increment no longer returns double the increment value; Oracle 11g boundary queries fixed to avoid unsupported OFFSET…FETCH syntax; OpenLineage SMT fixed to emit dataset metadata for schema changes and avoid redundant dedup cache writes; NullPointerException in heartbeat error handlers fixed when driver reports no SQL state; PostgreSQL connector fixed to correctly parse text defaults containing escaped single quotes; Informix CDC data stream error processing CLOB after VARCHAR columns resolved; PostgreSQL JDBC driver bumped to 42.7.13 for CVE-2026-54291; Kafka/Connect dependencies removed from installation packages"
