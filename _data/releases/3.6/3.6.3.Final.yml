version: "3.6.3.Final"
stable: true
summary: "Oracle: added ORA-02002 to the list of retriable exceptions; Oracle: corrected savepoint partial rollback handling for tables with LOB columns; Oracle: fixed non-idempotent partial rollbacks and stale deferred transactions pinning the offset SCN; Oracle: resolved unbounded online-mode sessions and cap-growth heuristic issues in log-count mining; Oracle: fixed CREATE INDEX DDL parsing when using the ONLINE keyword; Oracle: ensured XStream metrics bean implements the MXBean interface; Oracle: simplified LogMiner buffered implementation event logic; SQL Server: fixed ambiguous column name errors in lsn_time_mapping queries; SQL Server: fixed agent running check failure when the status query returns no rows; Vitess: fixed gRPC channel leaks on repeated connect and NPE on close; Vitess: corrected vgtid configuration equality comparison; Vitess: fixed task crash on zero-day DATETIME values; Informix: resolved irregular connector heartbeat intervals; MySQL and MariaDB: fixed error handlers improperly classifying retriable exceptions as non-retriable"
