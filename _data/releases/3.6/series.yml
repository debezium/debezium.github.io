summary: Version 3.6 release stream
version: "3.6"
overview: Debezium Engine Quarkus Extension; Docling SMT for document processing; Amazon SNS sink; OAuth2 support for HTTP sink; Nested field creation in SMTs; Configurable heartbeat topic sharing; Schema caching improvements; Signal-based binlog position adjustment for MariaDB
displayed: true
hidden: false
tutorial: true
connectors:
  - mysql
  - mariadb
  - mongodb
  - postgres
  - oracle
  - sqlserver
  - cassandra-3
  - cassandra-4
  - db2
  - spanner
  - vitess
  - jdbc
  - informix
  - ibmi
  - cockroachdb
compatibility:
  java:
    version: 17+ for connectors; 21+ for Debezium Server, Operator, Outbox and Quarkus extension
  connect:
    version: 3.1 and later
  mysql:
    database:
      versions:
        - 8.0.x
        - 8.4.x
        - 9.0
        - 9.1
    driver:
      versions:
        - 9.1.0
  mariadb:
    database:
      versions:
        - 11.4.x
        - 11.7.x
    driver:
      versions:
        - 3.5.3
  mongodb:
    database:
      versions:
        - 6.0
        - 7.0
        - 8.0
    driver:
      versions:
        - 5.6.2
  postgresql:
    database:
      versions:
        - 14
        - 15
        - 16
        - 17
        - 18
      plugins:
        - decoderbufs
        - pgoutput
    driver:
      versions:
        - 42.7.11
  sqlserver:
    database:
      versions:
        - 2017
        - 2019
        - 2022
    driver:
      versions:
        - 12.4.2.jre8
  oracle:
    database:
      versions:
        - 19c
        - 21c
        - 23ai (LogMiner only)
        - 26ai (LogMiner only)
    driver:
      versions:
        - 19.x
        - 21.x
        - 23.x (with 23ai and 26ai only)
    olr:
      versions:
        - 1.3.x-1.9.x
  cassandra-3:
    database:
      versions:
        - 3.11.12
    driver:
      versions:
        - 3.11.12
  cassandra-4:
    database:
      versions:
        - 4.1.7
    driver:
      versions:
        - 4.14.0
  cassandra-5:
    database:
      versions:
        - 5.0.2
    driver:
      versions:
        - 4.14.0
  db2:
    database:
      versions:
        - 11.5
    driver:
      versions:
        - 11.5.0.0
  spanner:
    database:
      versions:
        - 6.x
    driver:
      versions:
        - 6.x
  vitess:
    database:
