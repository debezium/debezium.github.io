date: 2026-11-19
version: "3.8.0.Alpha2"
stable: false
summary: "Managed initial snapshots support in the TiDB connector; PostgreSQL connector support for schema comments via include.schema.comments; Performance optimizations for Oracle LogMiner queries; Compaction control added to RocksDB reselect columns post processor cache; Support for JSON serialized span context in ActivateTracingSpan SMT; Authentication for HTTP notification callbacks via notification.http.authorization; Value and key output format configuration for Debezium Server CR; Engine shutdown strategies exposed in Quarkus extension via @ShutdownCondition; Binlog client compiler target raised to Java 17; Fixes for Oracle LogMiner extended string emission, buffered transaction rereading, and LOB write parsing; Fix for PostgreSQL connector DML loss when restarting from transactional logical messages following COPY; Fix for Debezium Server staying running after engine failure; Fix for SQL Server connector applying unavailable.value.placeholder to NULL max-type columns; Fix for CockroachDB connector changefeed creation in initial_only snapshot mode; Fix for MySQL binlog client buffer and cleaner memory leak on JDK 21; Driver updates resolving CVEs for MySQL, MariaDB, and SQL Server connectors"
announcement_url: /blog/2026/11/19/debezium-3-8-alpha2-released/
