date: 2026-11-02
version: "3.8.0.Alpha1"
stable: false
summary: "Snapshot progress monitoring on the Platform Overview and a new Snapshots tab; JDBC sink connector now defaults to the sink framework mode; S3 claim-check support for oversized PostgreSQL change events; MongoDB connector gains readable starting timestamps, required pre- and post-images, query.fetch.size support and earlier wake-up of streaming consumers; ReselectColumnsPostProcessor can query an Oracle secondary; NATS KV state storage; new StringifyFields transformation that serializes selected fields to JSON strings; SingleStore JDBC sink adds MULTIPOLYGON support and optional polygon repair; MySQL 8.x binlog_row_metadata=FULL support; Spanner change stream support for placement tables; Quarkus extension integrates the Debezium ServiceLoader with CDI (ArC); signal.data.collection is validated at connector validate() time; Oracle unbuffered LogMiner now emits periodic heartbeats for quiet tables; YashanDB connector allows advanced YStream client options; Debezium Server and container images upgraded to Fedora 44, with the logging backend replaced by Log4j 2.x; many MySQL and MariaDB schema default, DATETIME snapshot and GTID resume fixes; PostgreSQL fixes for snapshot timestamp throughput, lost changes on restart and infinity date consistency; Oracle fixes for XMLTYPE snapshots, RAC boundary SCN skips and XStream restart failures; SQL Server fixes for datetime2 DST shifts, incremental snapshot datetime keys and CDC instance filtering; breaking changes include the Zerobus sink event filter removal and PostgreSQL ENUM array, VARBIT(1) and MySQL REAL handling changes"
announcement_url: /blog/2026/11/02/debezium-3-8-alpha1-released/
