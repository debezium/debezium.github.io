# -----------------------------------------------------------------------------
# Deployment pages
# -----------------------------------------------------------------------------
# Drives _layouts/deployment.html (/deployment/) and _layouts/deployment-detail.html
# (one page per entry). The landing-page cards stay in _data/deployments.yml;
# this file holds the detail those cards link to.
#
# Each entry keyed by the id used in the page's `deployment:` front matter.
#
#   flow          the architecture, as connected boxes
#   how           one paragraph on what actually happens
#   choose_when   reasons to pick it
#   consider      honest trade-offs - a page that only lists benefits is an
#                 advert, and the reader has to find the catch somewhere
#   requirements  what you need before you start
#   docs          reference documentation
#
# Grounded in the reference docs. Notably: the Operator manages Debezium Server
# instances, so Kubernetes is a managed way to run Server rather than a separate
# runtime; and the Platform is documented as incubating, Kubernetes only.
#
# {version} in an href is replaced with the latest stable series at build time.
# -----------------------------------------------------------------------------

platform:
  title: Debezium Platform
  tagline: Managed pipelines on Kubernetes
  status: incubating
  status_note: >-
    The Platform is in an incubating state. Its configuration options and
    semantics may still change, and Kubernetes is currently the only supported
    environment.
  summary: >-
    A web application over the Debezium Operator. You describe a pipeline once -
    a source, any transforms, a destination - and the Platform creates, deploys
    and manages it on your cluster for you.
  flow:
    - label: Platform UI
      sub: Design and manage pipelines
      icon: layers
    - label: Debezium Operator
      sub: Reconciles the cluster state
      icon: kubernetes
    - label: Debezium Server
      sub: One instance per pipeline
      icon: server
    - label: Destination
      sub: Your messaging or storage
      icon: arrow-right
  how: >-
    The Platform takes a data-centric view: pipelines, sources and destinations
    are things you manage, not properties files you maintain. What you design in
    the interface becomes custom resources the Operator reconciles, so the
    cluster remains declarative and anything the Platform does can also be done
    with kubectl.
  choose_when:
    - You want people to build pipelines without hand-writing connector configuration
    - You are already on Kubernetes and want lifecycle management rather than YAML
    - Several teams need to run pipelines without each learning the connector reference
    - You want credentials handled centrally instead of pasted into config
  consider:
    - Incubating, so expect change between releases
    - Kubernetes only - there is no standalone Platform deployment
    - Adds a component to operate on top of the Operator and Server
  requirements:
    - A Kubernetes or OpenShift cluster
    - The Debezium Operator, installed with Helm
    - Java 21 or later for the Server instances it manages
  docs:
    - label: Debezium Platform
      href: /documentation/reference/{version}/operations/debezium-platform.html
    - label: Debezium Operator
      href: /documentation/reference/{version}/operations/debezium-operator.html

kafka-connect:
  title: Kafka Connect
  tagline: The classic distributed deployment
  summary: >-
    Debezium connectors run as source connectors inside a Kafka Connect cluster,
    writing change events to Kafka topics. This is the most common way Debezium
    is deployed, and the one the documentation assumes unless it says otherwise.
  flow:
    - label: Your database
      sub: Transaction log
      icon: database
    - label: Debezium connector
      sub: Running as a Connect task
      icon: plug
    - label: Kafka Connect
      sub: Distributed workers
      icon: sitemap
    - label: Kafka topics
      sub: One per captured table
      icon: server
  how: >-
    Each connector connects to its source database and streams committed changes
    into Kafka. Connect stores offsets, connector configuration and database
    schema history in Kafka topics, which is what lets a worker fail and its work
    resume elsewhere without replaying from the beginning.
  choose_when:
    - You already run Kafka, or you want change events in Kafka
    - You want fault tolerance and rebalancing handled by the runtime
    - You want the Connect ecosystem - converters, sink connectors, transforms
    - Multiple consumers need the same change stream, independently
  consider:
    - You have to run and operate Kafka and Kafka Connect
    - Heaviest of the options if Kafka is not already part of your stack
    - Topic and schema management becomes part of your operational surface
  requirements:
    - Apache Kafka 3.1 or later, with a Kafka Connect cluster
    - Java 17 or later
    - Connector plug-in installed on the Connect workers
  docs:
    - label: Architecture
      href: /documentation/reference/{version}/architecture.html
    - label: Installation
      href: /documentation/reference/{version}/install.html
    - label: Tutorial
      href: /documentation/reference/{version}/kc-tutorial.html

server:
  title: Debezium Server
  tagline: Standalone, no Kafka required
  summary: >-
    A ready-to-run application that streams change events from a source database
    straight to messaging infrastructure - Kinesis, Pub/Sub, Pulsar, Redis, NATS
    and many others - configured with a single properties file.
  flow:
    - label: Your database
      sub: Transaction log
      icon: database
    - label: Debezium Server
      sub: Standalone application
      icon: server
    - label: Sink
      sub: Kinesis, Pub/Sub, Pulsar, Qdrant, …
      icon: arrow-right
  how: >-
    Server embeds the same connectors used under Kafka Connect and hands each
    change event to a configured sink. One process, one properties file, no
    cluster to stand up - which also means the process is the unit of scale and
    of failure.
  choose_when:
    - You do not run Kafka and do not want to start
    - Your destination is a cloud messaging service or a vector store
    - You want the smallest thing that will do the job
    - You are deploying to Kubernetes, where the Operator manages Server for you
  consider:
    - If your destination is Kafka, Kafka Connect is the better fit
    - Scaling and failover are yours to arrange, unless the Operator does it
    - The Oracle connector needs its JDBC driver added to the lib directory
  requirements:
    - Java 21 or later
    - A supported sink, configured in application.properties
    - Somewhere to keep offsets so restarts resume rather than re-snapshot
  docs:
    - label: Debezium Server
      href: /documentation/reference/{version}/operations/debezium-server.html
    - label: Sink configuration
      href: /documentation/reference/{version}/operations/debezium-server.html#_sink_configuration

kubernetes:
  title: Kubernetes
  tagline: Operator managed, cloud native
  summary: >-
    The Debezium Operator runs Debezium Server instances on Kubernetes and
    OpenShift. You declare a pipeline as a custom resource and the Operator
    reconciles it, the way Kubernetes reconciles everything else.
  flow:
    - label: Custom resource
      sub: Your pipeline, declared
      icon: code
    - label: Debezium Operator
      sub: Watches and reconciles
      icon: kubernetes
    - label: Debezium Server
      sub: Deployed for you
      icon: server
    - label: Sink
      sub: Your destination
      icon: arrow-right
  how: >-
    The Operator implements the standard operator pattern: it turns
    user-defined Debezium resources into running Server deployments and keeps
    them matching what you declared. Because the desired state is a resource in
    the cluster, the same GitOps and RBAC you use for everything else applies.
  choose_when:
    - Kubernetes is already how you deploy things
    - You want pipelines under version control and applied declaratively
    - You want rolling upgrades and restarts handled by the platform
    - You want secrets, probes and metrics wired the way the rest of the cluster is
  consider:
    - It runs Debezium Server, so Server's trade-offs apply here too
    - Another operator to install and keep current
    - For a UI over this, see the Platform - which builds on the same Operator
  requirements:
    - A Kubernetes or OpenShift cluster
    - The Debezium Operator, installed with Helm
    - Java 21 or later for the Server instances
  docs:
    - label: Debezium Operator
      href: /documentation/reference/{version}/operations/debezium-operator.html
    - label: Kubernetes
      href: /documentation/reference/{version}/operations/kubernetes.html

embedded:
  title: Embedded Engine
  tagline: Debezium as a library
  summary: >-
    Add Debezium as a dependency and consume change events in process. No
    connector cluster, no messaging system in between - your application is the
    consumer.
  flow:
    - label: Your database
      sub: Transaction log
      icon: database
    - label: Embedded engine
      sub: A dependency in your JVM app
      icon: code
    - label: Your code
      sub: Handles each event
      icon: bolt
  how: >-
    The engine runs a connector inside your process and calls your handler for
    each change event. Everything the Connect runtime would have done for you -
    delivery, retries, where offsets live, what happens when the process dies -
    becomes your application's responsibility.
  choose_when:
    - You want change events inside one application with full publishing control
    - Adding a cluster is disproportionate to the problem
    - You want full control over how events are handled and acknowledged
    - You are building a tool or product on top of Debezium
  consider:
    - No cluster means no rebalancing and no failover - one process does the work
    - You own delivery guarantees and error handling
    - Best suited to applications that can tolerate the engine's lifecycle
  requirements:
    - Java 17 or later
    - The engine and connector on your classpath
    - An offset store your application configures
  docs:
    - label: Embedded engine
      href: /documentation/reference/{version}/development/engine.html
