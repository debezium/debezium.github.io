# -----------------------------------------------------------------------------
# Installation options shown on the landing page
# -----------------------------------------------------------------------------
# Rendered by _includes/home/installation.html
#
#   id       - stable identifier, also used as the CSS hook
#   icon     - key resolved by _includes/dbz/icon.html
#   accent   - "brand" (green) or "accent" (blue); alternates the card colouring
#   tagline  - short qualifier shown under the title
#   summary  - one paragraph, keep to roughly 30 words
#   points   - three to four bullets; these are the differentiators
#   href     - secondary page with the full detail
#   docs     - deep link into the reference documentation
#   badge    - optional pill rendered in the card corner
# -----------------------------------------------------------------------------

heading: Install Debezium your way
subheading: >-
  The same connectors, the same change events, several different runtimes.
  Pick the one that matches the infrastructure you already run.

# Debezium Platform is deliberately not one of the `models` below. It is not a
# fourth runtime competing with Kafka Connect or Debezium Server - it is a
# front end over the Debezium Operator that manages Kubernetes deployments for
# you. Presenting it as a peer card would imply a choice between them, so it
# gets a featured card of its own above the runtime grid.
featured:
  id: platform
  icon: layers
  eyebrow: Recommended
  title: Debezium Platform
  tagline: The managed way to run Debezium on Kubernetes
  summary: >-
    A web front end over the Debezium Operator. Design a pipeline once, from
    source through transforms to destination, then let the Platform create,
    deploy and manage its entire lifecycle on your cluster.
  points:
    - Design pipelines visually instead of hand-writing connector configuration
    - Full lifecycle management - create, deploy, edit, pause, resume, monitor
    - Backed by the Debezium Operator, so the cluster stays declarative
    - Smart configuration editor and centralised credential handling
  # Rendered as the small pipeline diagram beside the copy.
  pipeline:
    - label: Source
      icon: database
    - label: Transform
      icon: wand
    - label: Destination
      icon: server
  href: /installation/platform/
  docs: /documentation/reference/stable/operations/debezium-platform.html

# Heading for the runtime grid, shown under the featured card.
models_heading: Or run the engine directly

models:
  - id: kafka-connect
    icon: plug
    accent: brand
    title: Kafka Connect
    tagline: The classic distributed installation
    summary: >-
      Run Debezium connectors inside a Kafka Connect cluster and stream change
      events straight into Apache Kafka topics.
    points:
      - Horizontal scaling and automatic task rebalancing
      - Offsets and schema history stored durably in Kafka
      - Single Message Transforms and the full Connect ecosystem
    href: /installation/kafka-connect/
    docs: /documentation/reference/stable/architecture.html
    badge: Most popular

  - id: server
    icon: server
    accent: accent
    title: Debezium Server
    tagline: Standalone, no Kafka required
    summary: >-
      A ready-to-run application that captures changes and sends them to a
      messaging infrastructure of your choice.
    points:
      - Sinks to Kinesis, Pub/Sub, Pulsar, Redis, RabbitMQ, NATS and more
      - Configured with a single properties file
      - Small footprint, quick to stand up
    href: /installation/server/
    docs: /documentation/reference/stable/operations/debezium-server.html

  - id: kubernetes
    icon: kubernetes
    accent: brand
    title: Kubernetes
    tagline: Operator managed, cloud native
    summary: >-
      Declare your pipelines as custom resources and let the Debezium Operator
      reconcile them the way Kubernetes reconciles everything else.
    points:
      - GitOps friendly, fully declarative configuration
      - Rolling upgrades and self healing handled for you
      - Add Debezium Platform on top for a managed UI over the same Operator
    href: /installation/kubernetes/
    docs: /documentation/reference/stable/operations/debezium-server.html

