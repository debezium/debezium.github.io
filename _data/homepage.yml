# -----------------------------------------------------------------------------
# Landing page content and section switches
# -----------------------------------------------------------------------------
# Drives _layouts/index.html. Every section can be turned off here without
# touching a template. Section-specific content lives in its own data file:
#
#   _data/deployments.yml  deployment models
#   _data/databases.yml    supported platform carousels
#   _data/adopters.yml     adopter carousel
#   _data/ai.yml           the AI section
# -----------------------------------------------------------------------------

hero:
  eyebrow: Open source change data capture
  # `title_lead` is rendered in the normal text colour, `title_accent` in green.
  title_lead: Stream changes from
  title_accent: your database.
  description: >-
    Debezium is an open source distributed platform for change data capture.
    Start it up, point it at your databases, and your apps can start responding
    to all of the inserts, updates, and deletes that other apps commit to your
    databases. Debezium is durable and fast, so your apps can respond quickly
    and never miss an event, even when things go wrong.
  primary_cta:
    # Matches the navbar CTA word for word. They share a destination, so two
    # different labels would read as two different actions.
    label: Get Started
    # {version} is replaced with the latest stable series at build time.
    # Single braces on purpose: a doubled brace would be parsed as Liquid.
    #
    # Points at the tutorials hub, not tutorial.html. As of 3.6 the docs split
    # the old page into tutorials.html (the index) and kc-tutorial.html (the
    # Kafka Connect walkthrough), leaving tutorial.html as a redirect to the
    # latter. Linking it would both cost a redirect hop and drop visitors into
    # the Kafka Connect path specifically, which sits badly next to the
    # deployment section offering five ways to run Debezium.
    #
    # Only safe because this resolves to the latest stable series: 3.5 and
    # earlier have no tutorials.html.
    href: /documentation/reference/{version}/tutorials.html
  # Sends first-time visitors further down the page rather than off-site.
  # GitHub is deliberately not repeated here: it already has an icon in the
  # navbar, and a full-width button gave an outbound link the same weight as
  # the primary call to action.
  secondary_cta:
    label: Explore deployment options
    href: "#deployment"
    icon: sitemap
  # Small proof points under the call to action.
  #
  # `count` derives the figure from _data/databases.yml instead of restating it,
  # so adding a connector updates the hero on its own. Use `value` for a figure
  # that is not a count of something.
  stats:
    - count: sources
      label: Source connectors
    - count: sinks
      label: Sink connectors
    - value: "100%"
      label: Apache 2.0 licensed

# Value propositions, shown as a compact grid under the hero. These replace
# the four long-form blocks of the previous _includes/features.html.
values:
  - icon: signal
    title: Do more with your data
    summary: >-
      React every time your data changes without modifying the apps that write
      it. Purge caches, update search indexes and keep other systems in sync.
  - icon: sitemap
    title: Simplify your apps
    summary: >-
      Stop making one service update the database and the search index and the
      cache. Move that work into services that consume change events instead.
  - icon: shield
    title: Never miss a beat
    summary: >-
      Take services down for maintenance and Debezium resumes exactly where it
      left off, in commit order, without dropping an event.
  - icon: bolt
    title: React quickly
    summary: >-
      Built for low latency and high throughput. Proven, scalable, and
      comfortable with large volumes of data.

sections:
  values:
    enabled: true
  deployments:
    enabled: true
  releases:
    enabled: true
    heading: Releases
    subheading: >-
      A stable series for production and a development series for what is
      coming next.
    # How many recent releases to list beside the two headline cards.
    recent_count: 4
    all_href: /releases/
    all_label: All releases
  ai:
    enabled: true
  databases:
    enabled: true
  blog:
    enabled: true
    heading: From the blog
    # Deliberately does not mention release notes. This section draws from posts
    # flagged `featured: true`, and release announcements are not flagged, so it
    # would be promising something the section cannot show. Releases already
    # have their own section on this page, with links to each announcement.
    #
    # The blog index says "release notes" and is right to: it lists every post.
    subheading: >-
      Deep dives, project updates and stories from the community.
    # Posts with `featured: true` in their front matter are preferred, newest
    # first. When there are not enough, the newest posts fill the remainder.
    count: 3
    all_href: /blog/
    all_label: Read the blog
  adopters:
    enabled: true