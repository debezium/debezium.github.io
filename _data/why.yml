# -----------------------------------------------------------------------------
# "Why Debezium" section
# -----------------------------------------------------------------------------
# Drives _layouts/why.html (/why/) and _layouts/use-cases.html
# (/why/use-cases/).
#
# The use cases are the ones the project's own FAQ names in "What are some uses
# of Debezium?" - cache invalidation, search indexes, CQRS and derived stores,
# audit logs, streaming queries, and propagating data between microservices via
# the outbox pattern - rather than a list invented for the page.
#
# {version} in an href is replaced with the latest stable series at build time.
# -----------------------------------------------------------------------------

overview:
  lead: >-
    Debezium is change data capture for the databases you already run. It reads
    committed changes from the transaction log and turns them into a stream of
    events your systems can react to, without you changing the applications that
    write the data.

  # What CDC is, for someone who has not met the term.
  what_is:
    heading: What change data capture actually does
    body: >-
      Most systems find out that data changed by asking: a job polls a table,
      compares timestamps, and hopes nothing was missed between runs. Change
      data capture reads the database's own transaction log instead - the same
      record the database uses for replication and recovery. Every insert,
      update and delete is there, in commit order, including the ones a polling
      query would step over.
    points:
      - No polling, and no `updated_at` column to maintain
      - Deletes are captured, not inferred from a row's absence
      - The before and after state of each row travels with the event
      - Negligible load on the source database

  # Why this project specifically.
  differentiators:
    heading: Why Debezium
    items:
      - icon: database
        title: Breadth of databases
        body: >-
          One event format and one set of guarantees across MySQL, PostgreSQL,
          Oracle, SQL Server, MongoDB, Db2, Cassandra and more, so adding a
          second database does not mean adopting a second tool.
      - icon: plug
        title: Runs where you already run
        body: >-
          Kafka Connect, standalone with Debezium Server, on Kubernetes via the
          Operator, or embedded as a library in your own JVM application. The
          connectors are the same in every case.
      - icon: shield
        title: Built to not lose events
        body: >-
          Offsets are recorded durably, so a restart resumes where it left off.
          Events keep the order they were committed in, and at-least-once
          delivery is the floor, not the aspiration.
      - icon: code
        title: Open source, no gates
        body: >-
          Apache License 2.0, hosted by the Commonhaus Foundation. No paid
          tier, no feature held back, no per-connector licence.

  # Where to go next.
  next:
    - icon: sitemap
      title: Use cases
      summary: The problems people actually solve with it.
      href: /why/use-cases/
    - icon: layers
      title: Installation options
      summary: Kafka Connect, Debezium Server, Kubernetes, embedded.
      href: /installation/
    - icon: database
      title: Supported databases
      summary: Every source and sink, and what each is tested against.
      href: /databases/
    - icon: sparkles
      title: Debezium & AI
      summary: Keeping vector stores and agents current.
      href: /ai/

# -----------------------------------------------------------------------------
# Use cases
# -----------------------------------------------------------------------------
use_cases:
  lead: >-
    Change events are general purpose: once a change leaves the database as an
    event, what consumes it is up to you. These are the patterns that come up
    most often.

  items:
    - id: cache-invalidation
      icon: bolt
      title: Cache invalidation
      problem: >-
        A cache is stale the moment the underlying row changes, and the service
        that wrote the row is rarely the one that knows what to evict.
      solution: >-
        Consume the change stream and evict or refresh exactly the entries that
        were affected, without the writing service knowing a cache exists.
      links:
        - label: Architecture
          href: /documentation/reference/{version}/architecture.html

    - id: search-indexes
      icon: signal
      title: Search and derived indexes
      problem: >-
        Search indexes drift from the database whenever an update path forgets
        to reindex, and full rebuilds get slower as the data grows.
      solution: >-
        Drive the index from the change stream so it converges on the database
        by construction, updating only the documents that changed.
      links:
        - label: Posts tagged elasticsearch
          href: /tag/elasticsearch/

    - id: microservices
      icon: sitemap
      title: Microservices data exchange
      problem: >-
        A service that writes to its database and then publishes a message can
        do one and not the other. Distributed transactions are the usual
        alternative, and they are worse.
      solution: >-
        Write the event to an outbox table in the same local transaction as the
        business data, and let Debezium publish it. One transaction, no dual
        write.
      links:
        - label: Outbox event router
          href: /documentation/reference/{version}/transformations/outbox-event-router.html
        - label: Posts tagged outbox
          href: /tag/outbox/

    - id: cqrs
      icon: chart
      title: CQRS and derived views
      problem: >-
        Read models that serve queries well are shaped differently from the
        normalised tables that accept writes.
      solution: >-
        Build and maintain read models from the change stream, so the write side
        stays normalised and the read side stays fast, without a batch job
        between them.
      links:
        - label: Posts tagged CQRS
          href: /tag/cqrs/
        - label: Event sourcing and CDC
          href: /tag/event-sourcing/

    - id: audit
      icon: shield
      title: Audit logs
      problem: >-
        Reconstructing who changed what, and when, from application logs is
        unreliable, and application-level auditing misses anything written
        outside the application.
      solution: >-
        The change stream is already a complete, ordered record of every
        committed change, with the before and after state of each row. Store it.
      links:
        - label: Event flattening
          href: /documentation/reference/{version}/transformations/event-flattening.html

    - id: streaming
      icon: bolt
      title: Streaming analytics
      problem: >-
        Analytics that run on last night's extract answer yesterday's question.
      solution: >-
        Feed change events into Flink, Kafka Streams or Spark and compute
        continuously, on data that is seconds rather than hours old.
      links:
        - label: Posts tagged Flink
          href: /tag/flink/
        - label: Posts tagged analytics
          href: /tag/analytics/

    - id: replication
      icon: server
      title: Replication and lakehouse ingest
      problem: >-
        Bulk copies into a warehouse or lakehouse are expensive, and their
        freshness is bounded by how often you can afford to run them.
      solution: >-
        Land changes continuously instead of re-copying tables, including into
        Iceberg and other lakehouse formats.
      links:
        - label: Posts tagged Iceberg
          href: /tag/iceberg/
        - label: Debezium Server sinks
          href: /documentation/reference/{version}/operations/debezium-server.html

    - id: ai
      icon: sparkles
      title: AI and retrieval
      problem: >-
        A retrieval index built from a nightly snapshot answers questions about
        a database that no longer exists.
      solution: >-
        Parse, embed and deliver changed rows to a vector store as they are
        committed, so retrieval reflects the current state of the data.
      links:
        - label: Debezium & AI
          href: /ai/
