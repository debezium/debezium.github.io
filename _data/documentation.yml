# -----------------------------------------------------------------------------
# Documentation overview page
# -----------------------------------------------------------------------------
# Drives _layouts/documentation.html.
#
# {version} in an href is replaced with the latest stable series at build time.
# Single braces on purpose: a doubled brace would be parsed as Liquid.
# -----------------------------------------------------------------------------

intro: >-
  Reference documentation for every Debezium series, plus the guides and
  answers most people need first.

# Entry points shown above the per-series list.
#
# These deliberately point at specific pages rather than at the documentation
# root - a card that lands on the same place as the button in the header is
# just a second copy of that button.
#
# The FAQ and Resources on the Web are not here: both already sit in the
# Documentation menu in the navigation bar, and neither is where someone
# reading the reference documentation wants to be sent first.
start_here:
  - id: tutorial
    icon: bolt
    title: Tutorial
    summary: Stand up a pipeline against a sample database and watch the events arrive.
    href: /documentation/reference/{version}/tutorials.html
  - id: install
    icon: server
    title: Installation
    summary: The common ways to deploy Debezium, whichever runtime you are using.
    href: /documentation/reference/{version}/install.html
  - id: architecture
    icon: sitemap
    title: Architecture
    summary: How the connectors, the engine and the runtimes fit together.
    href: /documentation/reference/{version}/architecture.html
  - id: source-connectors
    icon: database
    title: Source connectors
    summary: Capture changes from MySQL, PostgreSQL, Oracle, MongoDB and the rest.
    href: /documentation/reference/{version}/connectors/index.html
  - id: sink-connectors
    icon: server
    title: Sink connectors
    summary: Write change events onward, including the JDBC and MongoDB sinks.
    href: /documentation/reference/{version}/connectors/index-sink.html
  - id: monitoring
    icon: chart
    title: Monitoring
    summary: The metrics each connector exposes, and how to read them.
    href: /documentation/reference/{version}/operations/monitoring.html
