# -----------------------------------------------------------------------------
# Community overview page
# -----------------------------------------------------------------------------
# Drives _layouts/community.html. The wording of each panel is carried over
# from the previous _includes/community.html, which hardcoded it.
# -----------------------------------------------------------------------------

lead: >-
  Debezium is an open source project, and we welcome everyone who wants to help
  make it the best open source platform for change data capture.

panels:
  - id: help
    icon: code
    title: How can I help?
    body: >-
      You can contribute in multiple ways: by using Debezium, asking or
      answering questions, reporting issues, writing documentation, fixing bugs,
      discussing plans, and developing new features. Set up your local
      environment, star our
      <a href="https://github.com/debezium">GitHub repositories</a>, and check
      out our open issues.
    cta:
      label: Learn how
      href: /community/contribute/

  - id: questions
    icon: bot
    title: Where can I ask questions?
    body: >-
      Our <a href="/documentation/">documentation</a> is full of useful
      information, and you might find an answer to your question there. If not,
      jump into our
      <a href="https://debezium.zulipchat.com/#narrow/stream/302529-users">chat room for users</a>
      or join our
      <a href="https://groups.google.com/forum/#!forum/debezium">Google Group</a>.
      Our
      <a href="https://debezium.zulipchat.com/#narrow/stream/302529-users">user chat room</a>
      may be useful if you're interested in the in-depth inner workings of
      Debezium.

  - id: using
    icon: megaphone
    title: I'm using Debezium!
    body: >-
      We love to hear how people are using Debezium, so let us know on
      <a href="https://twitter.com/debezium">@debezium</a> or mention it in the
      <a href="https://groups.google.com/forum/#!forum/debezium">Google Group</a>.
      Include a link to your project, website, or blog post. We'd also be very
      happy to add you to our growing list of Debezium production users.
    cta:
      label: See who is using Debezium
      href: /community/users/

  - id: events
    icon: tag
    title: Where can I find community events?
    body: >-
      Debezium community meetings and events are listed in our shared Google
      Calendar. You can browse the schedule online or subscribe to the public
      iCalendar feed to keep upcoming events in your own calendar application.
    links:
      - label: View the calendar
        href: https://calendar.google.com/calendar/embed?src=e20c105dda5b464731fdd70b7e5cb113325be1f8c2f757c0495b16fa3950d1e7%40group.calendar.google.com&ctz=Europe%2FPrague
      - label: iCalendar feed
        href: https://calendar.google.com/calendar/ical/e20c105dda5b464731fdd70b7e5cb113325be1f8c2f757c0495b16fa3950d1e7%40group.calendar.google.com/public/basic.ics

# Cards linking to the rest of the community section.
sections:
  - id: adopters
    icon: database
    title: Adopters
    summary: Companies and projects running Debezium in production.
    href: /community/users/
  - id: contribute
    icon: code
    title: Contribute
    summary: How to get involved, from your first issue to your first pull request.
    href: /community/contribute/
  - id: governance
    icon: sitemap
    title: Governance
    summary: Project roles, how decisions get made, and how they change.
    href: /community/governance/
  # /foundation/faq/ was previously reachable only from a line in the 2024
  # "Moving Debezium to the Commonhaus Foundation" post - nothing in the
  # navigation, the footer or the governance page pointed at it. It is now also
  # linked from the FAQ entry on governance and licensing.
  - id: foundation
    icon: shield
    title: Debezium at Commonhaus
    summary: What moving to the Commonhaus Foundation means for the project.
    href: /foundation/faq/
