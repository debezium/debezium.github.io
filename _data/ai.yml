# -----------------------------------------------------------------------------
# Debezium & AI
# -----------------------------------------------------------------------------
# Drives the section on the landing page (_includes/home/ai.html) and the
# /ai/ page (_layouts/ai.html).
#
# Everything claimed here maps to something Debezium actually ships. The
# capability entries correspond to documented transformations and sinks:
#
#   ai/embeddings.html            Embeddings transformation
#   ai/docling.html               Docling transformation
#   transformations/vector-to-json.html
#   operations/debezium-server.html   Qdrant and Milvus sinks
#
# {version} in an href is replaced with the latest stable series at build time.
# -----------------------------------------------------------------------------

eyebrow: Debezium & AI
heading: Give your models fresh context
subheading: >-
  Retrieval pipelines and agents are only as current as the data behind them.
  Debezium turns every committed row change into an event, and can parse,
  vectorise and deliver it to a vector store without any glue code in between.

href: /ai/
cta_label: Explore Debezium for AI

# Shown as cards on the landing page and in the first section of /ai/.
capabilities:
  - id: embeddings
    icon: sparkles
    title: Embeddings in the pipeline
    summary: >-
      The Embeddings transformation vectorises text as it passes through, using
      Ollama, Hugging Face, Voyage AI or a local ONNX model.
    href: /documentation/reference/{version}/ai/embeddings.html

  - id: docling
    icon: wand
    title: Document parsing
    summary: >-
      The Docling transformation converts PDF, DOCX and HTML into a form a
      language model can actually consume.
    href: /documentation/reference/{version}/ai/docling.html

  - id: vector-stores
    icon: database
    title: Straight into a vector store
    summary: >-
      Debezium Server writes to Qdrant and Milvus directly, so the vector index
      follows the database rather than a nightly job.
    href: /documentation/reference/{version}/operations/debezium-server.html

  - id: vector-types
    icon: chart
    title: Native vector columns
    summary: >-
      Vector column types are captured with their semantics intact, and the
      Vector to JSON transformation remaps them when you need something plainer.
    href: /documentation/reference/{version}/transformations/vector-to-json.html

# The pipeline diagram on /ai/. Each stage names the component that does it.
pipeline:
  - label: Your database
    detail: A row changes. Debezium reads the commit from the transaction log.
    icon: database
  - label: Parse
    detail: The Docling transformation turns documents into clean, chunkable text.
    icon: wand
  - label: Embed
    detail: The Embeddings transformation turns that text into vectors in flight.
    icon: sparkles
  - label: Vector store
    detail: Debezium Server writes the result to Qdrant or Milvus.
    icon: server

# Longer-form points for /ai/ only.
why:
  - title: No nightly reindex
    body: >-
      Change data capture means only what changed is re-embedded. The cost of
      keeping an index current tracks your write rate, not the size of your
      corpus.
  - title: The database stays the source of truth
    body: >-
      Nothing has to write twice. Your application keeps writing to its database
      exactly as it does now, and the vector store follows from the log.
  - title: Ordering and delivery you can reason about
    body: >-
      Events arrive in the order they were committed, and Debezium resumes from
      where it stopped after a restart - so an index cannot silently drift out
      of step with the data.

