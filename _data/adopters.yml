# -----------------------------------------------------------------------------
# Debezium adopters and downstream integrations
# -----------------------------------------------------------------------------
# This file is the single source of truth for both the carousel on the landing
# page and the "Who's Using Debezium?" page at /community/users/.
#
# It previously lived as a bullet list in community/users.asciidoc. Keeping a
# copy here as well meant two lists to update, and the first version of this
# file was generated by sweeping every bullet in that page - which silently
# swept the downstream integrations and the "...and you?" invitation into the
# adopter list too, so the landing page advertised Airbyte and Apache Camel as
# production users.
#
#   name - company, organisation or project name (required)
#   href - optional link to a case study, talk or integration page
#   logo - optional path under /assets/images/adopters/. When present the logo
#          is rendered instead of the name. Logos are trademarks of their
#          owners, so only add one where the owner has agreed to it; the
#          wordmark fallback is always safe.
#
# Keep both lists in alphabetical order.
#
# To be added or removed, open a pull request against this file.
# -----------------------------------------------------------------------------

# Landing page carousel
heading: Trusted in production
subheading: >-
  Teams around the world run Debezium against their busiest databases.
all_href: /community/users
all_label: See every adopter

# Scroll speed in pixels per second. Larger is faster.
#
# Deliberately a velocity rather than a loop duration: a duration would make a
# long row race past while a short one crawled. assets/javascript/dbz.js
# measures the real track width and derives the duration from it. Keep this in
# step with _data/databases.yml.
speed: 45

# /community/users/ page
page:
  lead: >-
    Debezium is used in production by a wide range of companies and
    organizations. This list contains users of Debezium who agreed to serve as
    public reference; where available, further resources with more details are
    linked.
  integrations_heading: Integrations
  integrations_lead: >-
    Debezium is also integrated with and used by a number of downstream
    third-party projects and products.

