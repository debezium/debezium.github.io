# -----------------------------------------------------------------------------
# Supported database platforms shown in the landing page carousel
# -----------------------------------------------------------------------------
# Rendered by _includes/home/databases.html.
#
#   id     - matches the connector id in _data/connectors.yml where one exists
#   name   - display name
#   logo   - optional path under /assets/images/databases/. When present the
#            logo is rendered; otherwise a wordmark chip is shown. Database
#            logos are trademarks of their owners, so only add a file once its
#            licence has been checked - the wordmark fallback is always safe.
#   href   - documentation for that connector. Optional: a connector that has
#            shipped before its reference page is published renders unlinked
#   status - "ga" or "incubating"; drives the pill shown on the chip
#   compat - optional list of test-matrix entries (keys under `compatibility`
#            in _data/releases) shown on /databases/. Defaults to the id. Set it
#            when the keys differ (postgresql) or one connector is tested as
#            several entries (Cassandra 4 and 5); each is shown under its name
#            from `integrations` in _config.yml
#   capture        - optional; false hides the "Capture Now" button on this
#                    source's card on /databases/ (see `capture:` below)
#   capture_params - optional; query parameters for this source's "Capture
#                    Now" link, used instead of capture.params (not merged)
# -----------------------------------------------------------------------------

heading: Capture from the databases you already run
subheading: >-
  One event format, one set of guarantees, across every supported platform.

all_href: /databases/
all_label: Compare every connector

# Second call to action on each source card on /databases/, beside the
# Documentation link. Set enabled to false to remove it from every card.
#
#   label    - button text; an arrow is added after it
#   base_url - where every button links to
#   params   - query parameters added to each link. In the values, {id},
#              {name} and {version} are replaced with the card's connector id,
#              display name and the current stable series. Each value is
#              URL-encoded, so a card gets e.g. ?database=postgres&version=3.7
capture:
  enabled: false
  label: Capture Now
  base_url: https://code.debezium.io
  params:
    database: "{id}"
    version: "{version}"

# Scroll speed in pixels per second. Larger is faster. See the note in
# _data/adopters.yml; keep the two values in step so the rows match.
speed: 45

sources:
  # Stable first, then incubating; alphabetical within each group.
  #
  # The status split carries real information - what is production ready - so it
  # is worth keeping. Within a group, alphabetical is predictable: any other
  # ordering is a judgement about which database matters most, which nobody can
  # guess at and everybody will want to argue about. This matches the ordering
  # convention already stated for `integrations` in _config.yml.
  - id: cockroachdb
    name: CockroachDB
    href: /documentation/reference/stable/connectors/cockroachdb.html
    status: ga
  - id: db2
    name: Db2 for LUW / zOS
    href: /documentation/reference/stable/connectors/db2.html
    status: ga
  - id: mariadb
    name: MariaDB
    href: /documentation/reference/stable/connectors/mariadb.html
    status: ga
  - id: mongodb
    name: MongoDB
    href: /documentation/reference/stable/connectors/mongodb.html
    status: ga
  - id: mysql
    name: MySQL
    href: /documentation/reference/stable/connectors/mysql.html
    status: ga
  - id: oracle
    name: Oracle
    href: /documentation/reference/stable/connectors/oracle.html
    status: ga
  - id: postgres
    name: PostgreSQL
    compat: [postgresql]
    href: /documentation/reference/stable/connectors/postgresql.html
    status: ga
  - id: sqlserver
    name: SQL Server
    href: /documentation/reference/stable/connectors/sqlserver.html
    status: ga

  - id: cassandra
    name: Cassandra
    # Cassandra 3 was dropped in 3.7; list only the versions still tested.
    compat: [cassandra-4, cassandra-5]
    href: /documentation/reference/stable/connectors/cassandra.html
    status: incubating
  - id: ibmi
    name: Db2 for IBM i
    href: /documentation/reference/stable/connectors/ibmi.html
    status: incubating
  - id: spanner
    name: Google Spanner
    href: /documentation/reference/stable/connectors/spanner.html
    status: incubating
  - id: informix
    name: Informix
    href: /documentation/reference/stable/connectors/informix.html
    status: incubating
  - id: ingres
    name: Ingres
    href: /documentation/reference/stable/connectors/ingres.html
    status: incubating
  # Source connector, new in 3.7. Milvus is also listed under sinks below.
  - id: milvus
    name: Milvus
    href: /documentation/reference/stable/connectors/milvus.html
    status: incubating
  # No href yet: new in 3.7, and the reference page is not published.
  - id: sqlite
    name: SQLite
    status: incubating
  # No href yet: new in 3.7, and the reference page is not published.
  - id: tidb
    name: TiDB
    status: incubating
  - id: vitess
    name: Vitess
    href: /documentation/reference/stable/connectors/vitess.html
    status: incubating
  - id: yashandb
    name: YashanDB
    href: /documentation/reference/stable/connectors/yashandb.html
    status: incubating

# Where change events can be delivered. Kafka Connect sinks plus the sinks
# built into Debezium Server.
#
# One flat alphabetical list, because that is how the page renders it - the
# Kafka Connect and Debezium Server entries were grouped here but shown as a
# single grid, so the grouping was invisible and the order just looked random.
# Each entry links to its own documentation, which is where the distinction
# actually matters.
#
# `href` is optional. Where a sink has shipped but the documentation has not
# caught up, leave it out and the entry renders without a link rather than
# pointing at a page that does not mention it.
sinks:
  - id: kinesis
    name: Amazon Kinesis
    href: /documentation/reference/stable/operations/debezium-server.html#debezium-server-amazon-kinesis-sink-configuration
  - id: sns
