# -----------------------------------------------------------------------------
# Top navigation bar
# -----------------------------------------------------------------------------
# Rendered by _includes/dbz/nav.html
#
# Each entry supports:
#   label    - text shown in the bar
#   href     - link target (omit when the entry only opens a dropdown)
#   match    - URL fragment; the entry is highlighted when page.url contains it
#   children - list of sub-entries, rendered as a drop-down menu
#   dynamic  - expands to a generated list instead of static children:
#                "documentation" -> one entry per displayed version, linking to docs
#                "releases"      -> one entry per displayed version, linking to releases
#              Generated entries are appended after any static children.
#
# Child entries additionally support:
#   description - short line of helper text shown under the label
#   external    - true to open in a new tab
#   divider     - true to render a separator instead of a link
# -----------------------------------------------------------------------------

brand:
  href: /
  # Dark theme uses the white wordmark, light theme the black one.
  logo_dark: /assets/images/color_white_debezium_type_600px.svg
  logo_light: /assets/images/color_black_debezium_type_600px.svg
  alt: Debezium

# Call-to-action button pinned to the right of the bar.
cta:
  label: Get Started
  # The tutorials index rather than tutorial.html, which is only a redirect to
  # the Kafka Connect walkthrough. See the note in _data/homepage.yml.
  href: /documentation/reference/stable/tutorials.html

items:
  - label: Why Debezium
    match: /why
    children:
      - label: Overview
        href: /why/
        description: What change data capture gives you
      - label: Use Cases
        href: /why/use-cases/
        description: Cache invalidation, search indexing, microservices
      - label: Debezium & AI
        href: /ai/
        description: Feeding real-time context to AI systems
      - label: Supported Databases
        href: /databases/
        description: Every source and sink connector

  - label: Installation
    match: /installation
    children:
      - label: Overview
        href: /installation/
        description: Choose the model that fits your stack
      - label: Debezium Platform
        href: /installation/platform/
        description: Managed pipelines on Kubernetes, recommended
      - label: Kafka Connect
        href: /installation/kafka-connect/
        description: The classic distributed installation
      - label: Debezium Server
        href: /installation/server/
        description: Standalone, no Kafka required
      - label: Operator for Debezium Server
        href: /installation/kubernetes/
        description: Operator-managed, cloud native
  - label: Developers
    match: /developers
    children:
      - label: Overview
        href: /developers/
        description: Using Debezium from application code
      - label: Embedded Engine
        href: /developers/embedded/
        description: Debezium as a library inside your app
      - label: Quarkus Extension
        href: /developers/#run-the-engine
        description: Run the engine inside a Quarkus application
      - divider: true
      # Beyond the two entry points above, the menu points at sections of
      # /developers/ rather than at individual reference pages. Listing each
      # integration here meant five of seven entries threw the reader out of the
      # site into the Antora docs, and duplicated a landing page that already
      # indexes all of it - so adding a card meant remembering to add a menu
      # item too. These ids are the `id:` values in _data/developers.yml.
      #
      # Absolute paths, not bare fragments: a bare "#observability" does nothing
      # from any other page, and this menu renders on every page including the
      # documentation.
      - label: Framework extensions
        href: /developers/#framework-extensions
        description: Outbox and Hibernate second-level cache
      - label: Shape the events
        href: /developers/#shape-the-events
        description: Custom converters and CloudEvents
      - label: Observability and testing
        href: /developers/#observability
        description: OpenTelemetry, OpenLineage, Testcontainers
      - label: Community projects
        href: /developers/#community-projects
        description: Built outside the project, such as pydbzengine

  - label: Learn
    href: /documentation/
    match: /documentation
    dynamic: documentation
    children:
      - label: Overview
        href: /documentation/
      - label: FAQ
        href: /documentation/faq
      - label: Resources on the Web
        href: /documentation/online-resources
      - divider: true

  - label: Releases
    href: /releases/
    match: /releases
    dynamic: releases
    children:
      - label: Overview
        href: /releases/
      - label: Roadmap
        href: /roadmap
      - divider: true

  - label: Community
    match: /community
    children:
      - label: Overview
        href: /community/
        description: Get involved with the project
      - label: Adopters
        href: /community/users
        description: Who is using Debezium in production
      - label: Contribute
        href: /community/contribute
        description: Your first pull request
      - label: Governance
        href: /community/governance
        description: How the project is run
      - divider: true
      - label: Chat on Zulip
        href: https://debezium.zulipchat.com/#narrow/stream/302529-users
        external: true
      - label: Mailing List
        href: https://groups.google.com/forum/#!forum/debezium
        external: true
      - label: GitHub
        href: https://github.com/debezium/debezium
        external: true

  - label: Blog
    href: /blog/
    match: /blog