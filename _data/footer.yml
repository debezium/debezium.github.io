foundation:
  href: https://commonhaus.org
  alt: Commonhaus Foundation
  # Commonhaus ships a purpose-made reverse variant for dark backgrounds. Use
  # it rather than filtering the default one: a brightness/invert filter
  # flattens the mark inside the square to a featureless block.
  logo_light: https://raw.githubusercontent.com/commonhaus/artwork/main/foundation/brand/svg/CF_logo_horizontal_single_default.svg
  logo_dark: https://raw.githubusercontent.com/commonhaus/artwork/main/foundation/brand/svg/CF_logo_horizontal_single_reverse.svg