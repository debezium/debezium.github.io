# -----------------------------------------------------------------------------
# Blog post template
# -----------------------------------------------------------------------------
# Drives _layouts/post.html.
#
# The two closing sections are the boilerplate that used to be hardcoded at the
# bottom of every post; the wording is carried over unchanged.
# -----------------------------------------------------------------------------

# Share targets. {url} and {title} are substituted at render time, both URL
# encoded. Single braces on purpose - a doubled brace would be parsed as Liquid.
#
# Facebook was dropped and Bluesky added, to match the accounts the footer
# actually links to. Re-add an entry here to change that; nothing else needs
# touching.
share:
  heading: Share this post
  targets:
    - id: linkedin
      label: LinkedIn
      href: https://www.linkedin.com/shareArticle?mini=true&url={url}&title={title}
    - id: x
      label: X
      href: https://twitter.com/intent/tweet?text={title}&url={url}&via=debezium
    - id: bluesky
      label: Bluesky
      href: https://bsky.app/intent/compose?text={title}%20{url}
    - id: reddit
      label: Reddit
      href: https://www.reddit.com/submit?url={url}&title={title}
    - id: email
      label: Email
      href: "mailto:?subject={title}&body={title}%20{url}"

# Closing sections, shown after the author cards on every post.
closing:
  - id: about
    heading: About Debezium
    body: >-
      Debezium is an open source distributed platform that turns your existing
      databases into event streams, so applications can see and respond almost
      instantly to each committed row-level change in the databases. Debezium is
      built on top of <a href="http://kafka.apache.org/">Kafka</a> and provides
      <a href="http://kafka.apache.org/documentation.html#connect">Kafka Connect</a>
      compatible connectors that monitor specific database management systems.
      Debezium records the history of data changes in Kafka logs, so your
      application can be stopped and restarted at any time and can easily consume
      all of the events it missed while it was not running, ensuring that all
      events are processed correctly and completely. Debezium is
      <a href="/license/">open source</a> under the
      <a href="http://www.apache.org/licenses/LICENSE-2.0.html">Apache License, Version 2.0</a>.

  - id: get-involved
    heading: Get involved
    body: >-
      We hope you find Debezium interesting and useful, and want to give it a
      try. Follow us on Twitter <a href="https://twitter.com/debezium">@debezium</a>,
      <a href="https://debezium.zulipchat.com/#narrow/stream/302529-users">chat with us on Zulip</a>,
      or join our <a href="https://groups.google.com/forum/#!forum/debezium">mailing list</a>
      to talk with the community. All of the code is open source
      <a href="https://github.com/debezium/">on GitHub</a>, so build the code
      locally and help us improve ours existing connectors and add even more
      connectors. If you find problems or have ideas how we can improve Debezium,
      please let us know or <a href="https://github.com/debezium/dbz/issues">log an issue</a>.

# Average reading speed used for the "n min read" estimate.
words_per_minute: 200

# Blog index (_layouts/blog.html)
listing:
  # Words of excerpt shown on each card in the list.
  excerpt_words: 45
  # Entries in the "Featured posts" panel. Posts opt in with `featured: true`
  # in their front matter; there are far more of those than fit a sidebar.
  featured_count: 6
  # Tags shown in the sidebar, most used first. The site has ~164 distinct
  # tags, so the full set would swamp the panel.
  tag_count: 28
  links:
    - label: All posts
      href: /blog/
      icon: book
    - label: Archive
      href: /archives
      icon: tag
    - label: RSS feed
      href: /blog.atom
      icon: external