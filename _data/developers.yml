# -----------------------------------------------------------------------------
# "Developers" section
# -----------------------------------------------------------------------------
# Drives _layouts/developers.html (/developers/).
#
# This section exists because the material was already written and unreachable:
# the reference docs carry eight pages under integrations/ plus development/,
# and until now nothing on the site linked to any of them. The audience is
# different from the rest of the nav - Installation is for whoever runs
# Debezium, Learn is reference, this is for someone putting Debezium inside an
# application.
#
# Most entries link straight into the reference docs. The embedded engine is
# the exception and has a page of its own, because it is the entry point for
# everything else here.
#
# {version} in an href is replaced with the latest stable series at build time.
# -----------------------------------------------------------------------------

overview:
  lead: >-
    Debezium is not only something you deploy alongside your services. The
    engine can run inside your own application, and there are extensions for
    the frameworks Java developers already use - so change data capture becomes
    a library you call rather than infrastructure you operate.

groups:
  - heading: Run the engine in your application
    id: run-the-engine
    items:
      - title: Embedded Engine
        summary: >-
          Add Debezium as a dependency and handle change events in process. No
          connector cluster and no broker in between.
        icon: code
        href: /developers/embedded/
      - title: Quarkus Extension
        summary: >-
          Run the embedded engine inside a Quarkus application, configured and
          managed the Quarkus way.
        icon: bolt
        href: /documentation/reference/{version}/integrations/quarkus-debezium-engine-extension.html

  - heading: Quarkus Framework extensions
    id: framework-extensions
    items:
      - title: Outbox
        summary: >-
          The Quarkus extension for the outbox pattern, which writes events to
          an outbox table as part of your transaction. Distinct from the outbox
          routing SMT, which reshapes those events on the way out.
        icon: layers
        href: /documentation/reference/{version}/integrations/outbox.html
      - title: Hibernate Second-Level Cache
        summary: >-
          Invalidate a Hibernate second-level cache from the change stream, so
          the cache follows writes made outside the application.
        icon: database
        href: /documentation/reference/{version}/integrations/hibernate-cache.html

  - heading: Shape the events
    id: shape-the-events
    items:
      - title: Custom Converters
        summary: >-
          Take control of how a column value is materialised in a change event
          when the default mapping is not what you need.
        icon: wand
        href: /documentation/reference/{version}/development/converters.html
      - title: CloudEvents
        summary: >-
          Emit change events in the CloudEvents format when the consumer expects
          that envelope rather than Debezium's own.
        icon: sitemap
        href: /documentation/reference/{version}/integrations/cloudevents.html

  - heading: Observability and testing
    id: observability
    items:
      # The docs page is titled "Distributed Tracing"; the integration itself is
      # OpenTelemetry, which is what a reader will be looking for.
      - title: OpenTelemetry
        summary: >-
          Propagate trace context through change events, so a span started in
          the writing application continues into whatever consumes the event.
        icon: signal
        href: /documentation/reference/{version}/integrations/tracing.html
      - title: OpenLineage
        summary: >-
          Emit lineage metadata as connectors run, so a pipeline's inputs and
          outputs show up in a lineage catalogue rather than in a diagram
          someone maintains by hand.
        icon: chart
        href: /documentation/reference/{version}/integrations/openlineage.html
      - title: Testcontainers
        summary: >-
          Stand up Debezium in an integration test, against a real database,
          without a permanent environment.
        icon: shield
        href: /documentation/reference/{version}/integrations/testcontainers.html

# Projects built outside the Debezium project.
#
# Kept in their own group, styled differently from the cards above and labelled
# as community work. Everything above is either reference documentation or the
# project's own contributing guide; giving a third-party library the same
# treatment would imply the project maintains and supports it, and the practical
# result is bug reports for someone else's code arriving on Debezium's tracker.
#
# Anything added here should be actively maintained, permissively licensed, and
# do something the project does not do itself - otherwise this becomes a link
# list nobody prunes.
community:
  id: community-projects
  heading: Community projects
  body: >-
    Built and maintained outside the Debezium project, by people in the
    community. Worth knowing about, but report problems to the project that
    owns them rather than to Debezium.
  items:
    - title: pydbzengine
      summary: >-
        A Pythonic interface to the embedded engine. It manages a JVM through
        JPype so change events can be handled in Python, and ships handlers for
        Apache Iceberg along with an Airflow operator.
      # The engine and both framework extensions above are JVM only, so this is
      # currently the only route for a Python application.
      language: Python
      author: Ismail Simsek
      href: https://memiiso.github.io/pydbzengine/
      post: /blog/2025/02/01/real-time-data-replication-with-debezium-and-python/

# Contributing a connector is a different activity from using Debezium in an
# application, so it sits apart rather than in the grid above. It is also the
# one link here that leaves the site.
contribute:
  id: writing-a-connector
  heading: Writing a connector
  body: >-
    Adding support for a new database, or changing an existing connector, is
    contributor work rather than integration work. It starts in the main
    repository.
  links:
    - label: Contributing guide
      href: https://github.com/debezium/debezium/blob/main/CONTRIBUTING.md
      external: true
    - label: How to contribute
      href: /community/contribute
