<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Debezium Platform deployment paths</title>
  <desc id="description">A Platform user deploys pipelines through Stage or the REST API to the Debezium Platform Conductor. The Conductor can deploy through the Debezium Operator to Kubernetes, or through SSH configuration and Ansible to a remote Docker host. An optional Host Agent receives HTTP lifecycle requests from Conductor and controls Docker on that remote host.</desc>
  <defs>
    <!-- Small fixed-size arrowhead (10 x 10 px), independent of line width -->
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35546b"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #183b56; }
      .lane { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #183b56; }
      .node-title { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #172b3a; }
      .node-text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #334e62; }
      .edge-label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #35546b; }
      .node { stroke: #4f6f85; stroke-width: 2; }
      .flow { fill: none; stroke: #35546b; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
      .optional { stroke-dasharray: 8 6; }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1440" height="720" fill="#ffffff"/>
  <text x="720" y="48" text-anchor="middle" class="title">One Platform API, two deployment paths</text>

  <!-- ===== Left column ===== -->
  <rect x="48" y="292" width="212" height="108" rx="12" class="node" fill="#edf4fb"/>
  <text x="154" y="336" text-anchor="middle" class="node-title">Platform user</text>
  <text x="154" y="365" text-anchor="middle" class="node-text">Stage UI or REST API</text>

  <rect x="326" y="272" width="252" height="148" rx="12" class="node" fill="#dbeef8"/>
  <text x="452" y="322" text-anchor="middle" class="node-title">Debezium Platform</text>
  <text x="452" y="349" text-anchor="middle" class="node-title">Conductor</text>
  <text x="452" y="380" text-anchor="middle" class="node-text">Pipeline orchestration</text>

  <!-- ===== Kubernetes lane ===== -->
  <rect x="638" y="78" width="750" height="226" rx="16" fill="#f2f7fb" stroke="#91aabd" stroke-width="2"/>
  <text x="674" y="119" class="lane">Kubernetes deployment</text>

  <rect x="674" y="150" width="180" height="104" rx="12" class="node" fill="#ffffff"/>
  <text x="764" y="194" text-anchor="middle" class="node-title">Debezium</text>
  <text x="764" y="220" text-anchor="middle" class="node-title">Operator</text>

  <rect x="923" y="150" width="180" height="104" rx="12" class="node" fill="#ffffff"/>
  <text x="1013" y="194" text-anchor="middle" class="node-title">Kubernetes</text>
  <text x="1013" y="220" text-anchor="middle" class="node-text">cluster</text>

  <rect x="1172" y="150" width="180" height="104" rx="12" class="node" fill="#ffffff"/>
  <text x="1262" y="194" text-anchor="middle" class="node-title">Debezium Server</text>
  <text x="1262" y="220" text-anchor="middle" class="node-text">workload</text>

  <!-- ===== Host-based lane ===== -->
  <rect x="638" y="394" width="750" height="274" rx="16" fill="#f4f9f3" stroke="#94af95" stroke-width="2"/>
  <text x="674" y="435" class="lane">Host-based deployment</text>

  <rect x="674" y="463" width="150" height="110" rx="12" class="node" fill="#ffffff"/>
  <text x="749" y="497" text-anchor="middle" class="node-title">SSH</text>
  <text x="749" y="523" text-anchor="middle" class="node-title">configuration</text>
  <text x="749" y="551" text-anchor="middle" class="node-text">Host inventory</text>

  <rect x="896" y="463" width="176" height="110" rx="12" class="node" fill="#ffffff"/>
  <text x="984" y="509" text-anchor="middle" class="node-title">Ansible</text>
  <text x="984" y="537" text-anchor="middle" class="node-text">Provision and control</text>

  <rect x="1144" y="458" width="208" height="192" rx="12" class="node" fill="#ffffff"/>
  <text x="1248" y="484" text-anchor="middle" class="node-title">Remote host</text>
  <rect x="1160" y="500" width="176" height="64" rx="10" class="node" fill="#fcebdc"/>
  <text x="1248" y="538" text-anchor="middle" class="node-title">Docker Engine</text>
  <rect x="1160" y="578" width="176" height="58" rx="10" class="node" fill="#f8dfe0"/>
  <text x="1248" y="602" text-anchor="middle" class="node-title">Debezium Server</text>
  <text x="1248" y="623" text-anchor="middle" class="node-text">container</text>

  <rect x="770" y="608" width="224" height="40" rx="10" class="node optional" fill="#fff8dc"/>
  <text x="882" y="634" text-anchor="middle" class="node-title">Optional Host Agent</text>

  <!-- ===== Arrows (all straight lines or clean elbows) ===== -->
  <!-- User to Conductor -->
  <path d="M 260 346 H 322" class="flow"/>

  <!-- Conductor forks into Kubernetes path (up) and host path (down) from one shared stem -->
  <path d="M 578 346 H 594 Q 608 346 608 332 V 216 Q 608 202 622 202 H 670" class="flow"/>
  <path d="M 578 346 H 594 Q 608 346 608 360 V 504 Q 608 518 622 518 H 670" class="flow"/>

  <!-- Kubernetes path -->
  <path d="M 854 202 H 919" class="flow"/>
  <path d="M 1103 202 H 1168" class="flow"/>

  <!-- Default host path: SSH, Ansible, Docker Engine -->
  <path d="M 824 518 H 892" class="flow"/>
  <path d="M 1072 518 H 1156" class="flow"/>

  <!-- Optional agent path (dashed): down from Conductor, across to Agent, then up into Docker Engine -->
  <path d="M 452 420 V 614 Q 452 628 466 628 H 766" class="flow dashed"/>
  <path d="M 994 628 H 1094 Q 1108 628 1108 614 V 560 Q 1108 546 1122 546 H 1156" class="flow dashed"/>

  <!-- ===== Edge labels ===== -->
  <text x="596" y="506" text-anchor="end" class="edge-label">Default runtime</text>
  <text x="552" y="618" text-anchor="middle" class="edge-label">Agent runtime: HTTP</text>
</svg>
