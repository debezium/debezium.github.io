<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" rx="8" fill="#fafafa"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1e1e">SCN-Based Batching: The Tuning Dilemma</text>

  <!-- ===== PEAK PERIOD (top half) ===== -->
  <rect x="30" y="50" width="800" height="210" rx="6" fill="#fff5f5" stroke="#e8e8e8" stroke-width="1"/>
  <text x="50" y="74" font-size="14" font-weight="bold" fill="#c0392b">Peak Period — Nightly batch ETL</text>

  <!-- Timeline -->
  <line x1="60" y1="140" x2="790" y2="140" stroke="#bdc3c7" stroke-width="2"/>

  <!-- Log file cylinders — dense, large -->
  <g>
    <rect x="80"  y="105" width="38" height="50" rx="4" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="99"  y="135" text-anchor="middle" font-size="9" fill="#c0392b">Log 1</text>
    <rect x="124" y="100" width="38" height="55" rx="4" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="143" y="135" text-anchor="middle" font-size="9" fill="#c0392b">Log 2</text>
    <rect x="168" y="98"  width="38" height="57" rx="4" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="187" y="135" text-anchor="middle" font-size="9" fill="#c0392b">Log 3</text>
    <rect x="212" y="102" width="38" height="53" rx="4" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="231" y="135" text-anchor="middle" font-size="9" fill="#c0392b">Log 4</text>
    <rect x="256" y="96"  width="38" height="59" rx="4" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="275" y="135" text-anchor="middle" font-size="9" fill="#c0392b">Log 5</text>
    <rect x="300" y="100" width="38" height="55" rx="4" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="319" y="135" text-anchor="middle" font-size="9" fill="#c0392b">Log 6</text>
    <rect x="344" y="104" width="38" height="51" rx="4" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="363" y="135" text-anchor="middle" font-size="9" fill="#c0392b">Log 7</text>
    <rect x="388" y="98"  width="38" height="57" rx="4" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="407" y="135" text-anchor="middle" font-size="9" fill="#c0392b">Log 8</text>
    <rect x="432" y="101" width="38" height="54" rx="4" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="451" y="135" text-anchor="middle" font-size="9" fill="#c0392b">Log 9</text>
    <rect x="476" y="97"  width="38" height="58" rx="4" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="495" y="135" text-anchor="middle" font-size="9" fill="#c0392b">Log 10</text>
    <rect x="520" y="103" width="38" height="52" rx="4" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="539" y="135" text-anchor="middle" font-size="9" fill="#c0392b">Log 11</text>
    <rect x="564" y="99"  width="38" height="56" rx="4" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="583" y="135" text-anchor="middle" font-size="9" fill="#c0392b">Log 12</text>
  </g>

  <!-- SCN range bracket -->
  <line x1="80" y1="170" x2="280" y2="170" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="80" y1="170" x2="80"  y2="160" stroke="#c0392b" stroke-width="2"/>
  <line x1="280" y1="170" x2="280" y2="160" stroke="#c0392b" stroke-width="2"/>
  <text x="180" y="188" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">SCN range = 1,000,000</text>

  <!-- Callout -->
  <rect x="340" y="170" width="430" height="44" rx="5" fill="#c0392b" opacity="0.1" stroke="#c0392b" stroke-width="1"/>
  <text x="555" y="188" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">SCN window spans 5+ large log files</text>
  <text x="555" y="204" text-anchor="middle" font-size="11" fill="#922b21">Millions of redo entries per pass — connector overwhelmed, excessive I/O</text>

  <!-- Multiple pass arrows -->
  <text x="100" y="240" font-size="10" fill="#7f8c8d">Pass 1</text>
  <line x1="150" y1="237" x2="280" y2="237" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowGrey)"/>
  <text x="300" y="240" font-size="10" fill="#7f8c8d">Pass 2</text>
  <line x1="350" y1="237" x2="480" y2="237" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowGrey)"/>
  <text x="500" y="240" font-size="10" fill="#7f8c8d">Pass 3</text>
  <line x1="550" y1="237" x2="680" y2="237" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowGrey)"/>
  <text x="700" y="240" font-size="10" fill="#7f8c8d">... N passes</text>

  <!-- ===== QUIET PERIOD (bottom half) ===== -->
  <rect x="30" y="275" width="800" height="210" rx="6" fill="#f0f4ff" stroke="#e8e8e8" stroke-width="1"/>
  <text x="50" y="299" font-size="14" font-weight="bold" fill="#2c3e50">Quiet Period — Sunday afternoon</text>

  <!-- Timeline -->
  <line x1="60" y1="370" x2="790" y2="370" stroke="#bdc3c7" stroke-width="2"/>

  <!-- Log file cylinders — sparse, small -->
  <g>
    <rect x="100" y="348" width="38" height="30" rx="4" fill="#3498db" opacity="0.2" stroke="#2980b9" stroke-width="1.5"/>
    <text x="119" y="367" text-anchor="middle" font-size="9" fill="#2980b9">Log 1</text>
    <rect x="320" y="352" width="38" height="26" rx="4" fill="#3498db" opacity="0.2" stroke="#2980b9" stroke-width="1.5"/>
    <text x="339" y="367" text-anchor="middle" font-size="9" fill="#2980b9">Log 2</text>
    <rect x="600" y="350" width="38" height="28" rx="4" fill="#3498db" opacity="0.15" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="619" y="367" text-anchor="middle" font-size="9" fill="#2980b9">Log 3</text>
    <text x="619" y="345" text-anchor="middle" font-size="8" fill="#7f8c8d">(partial)</text>
  </g>

  <!-- SCN range bracket — overshooting -->
  <line x1="100" y1="395" x2="720" y2="395" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="100" y1="395" x2="100" y2="385" stroke="#e67e22" stroke-width="2"/>
  <line x1="720" y1="395" x2="720" y2="385" stroke="#e67e22" stroke-width="2"/>
  <text x="410" y="413" text-anchor="middle" font-size="11" fill="#e67e22" font-weight="bold">SCN range = 1,00,000 — overshoots available data</text>

  <!-- Callout -->
  <rect x="170" y="428" width="520" height="44" rx="5" fill="#e67e22" opacity="0.1" stroke="#e67e22" stroke-width="1"/>
  <text x="430" y="446" text-anchor="middle" font-size="12" fill="#e67e22" font-weight="bold">Only 2.5 small logs exist in this SCN range</text>
  <text x="430" y="462" text-anchor="middle" font-size="11" fill="#d35400">Wasted reads on empty ranges, unnecessary polling cycles</text>

  <!-- Footer note -->
  <text x="430" y="506" text-anchor="middle" font-size="12" fill="#7f8c8d" font-style="italic">The same SCN range that overwhelms during peak, overshoots during quiet — no single tuning works for both.</text>
</svg>