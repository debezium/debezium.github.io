<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Arial, Helvetica, sans-serif">
  <!-- Background -->
  <rect width="760" height="480" rx="8" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1e1e">Configuration Complexity: Before and After</text>

  <!-- ===== LEFT COLUMN: Pre-3.6 ===== -->
  <rect x="30" y="55" width="320" height="390" rx="8" fill="#fff5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="190" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Pre-3.6</text>
  <text x="190" y="99" text-anchor="middle" font-size="11" fill="#7f8c8d">8+ interdependent properties</text>

  <!-- Property boxes — batch size group -->
  <text x="50" y="128" font-size="10" fill="#7f8c8d" font-weight="bold">Batch Size</text>
  <rect x="50" y="134" width="280" height="26" rx="4" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="152" font-size="11" fill="#922b21">log.mining.batch.size.default</text>
  <text x="310" y="152" text-anchor="end" font-size="10" fill="#7f8c8d">20000</text>

  <rect x="50" y="164" width="280" height="26" rx="4" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="182" font-size="11" fill="#922b21">log.mining.batch.size.min</text>
  <text x="310" y="182" text-anchor="end" font-size="10" fill="#7f8c8d">1000</text>

  <rect x="50" y="194" width="280" height="26" rx="4" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="212" font-size="11" fill="#922b21">log.mining.batch.size.max</text>
  <text x="310" y="212" text-anchor="end" font-size="10" fill="#7f8c8d">100000</text>

  <!-- Property boxes — sleep time group -->
  <text x="50" y="238" font-size="10" fill="#7f8c8d" font-weight="bold">Sleep Time</text>
  <rect x="50" y="244" width="280" height="26" rx="4" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="262" font-size="11" fill="#922b21">log.mining.sleep.time.default.ms</text>
  <text x="310" y="262" text-anchor="end" font-size="10" fill="#7f8c8d">1000</text>

  <rect x="50" y="274" width="280" height="26" rx="4" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="292" font-size="11" fill="#922b21">log.mining.sleep.time.min.ms</text>
  <text x="310" y="292" text-anchor="end" font-size="10" fill="#7f8c8d">0</text>

  <rect x="50" y="304" width="280" height="26" rx="4" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="322" font-size="11" fill="#922b21">log.mining.sleep.time.max.ms</text>
  <text x="310" y="322" text-anchor="end" font-size="10" fill="#7f8c8d">3000</text>

  <rect x="50" y="334" width="280" height="26" rx="4" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="352" font-size="11" fill="#922b21">log.mining.sleep.time.increment.ms</text>
  <text x="310" y="352" text-anchor="end" font-size="10" fill="#7f8c8d">200</text>

  <!-- Property boxes — SCN gap group -->
  <text x="50" y="378" font-size="10" fill="#7f8c8d" font-weight="bold">SCN Gap Detection</text>
  <rect x="50" y="384" width="280" height="26" rx="4" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="402" font-size="10" fill="#922b21">log.mining.scn.gap.detection.gap.size.min</text>
  <text x="310" y="402" text-anchor="end" font-size="10" fill="#7f8c8d">1000000</text>

  <rect x="50" y="414" width="280" height="26" rx="4" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="430" font-size="9.5" fill="#922b21">log.mining.scn.gap.detection.time.interval.max.ms</text>
  <text x="310" y="430" text-anchor="end" font-size="10" fill="#7f8c8d">20000</text>

  <!-- Dependency lines -->
  <line x1="42" y1="147" x2="42" y2="430" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
  <text x="38" y="290" text-anchor="middle" font-size="9" fill="#c0392b" transform="rotate(-90, 38, 290)" opacity="0.6">interdependent</text>

  <!-- ===== ARROW ===== -->
  <polygon points="440,240 410,220 410,232 385,232 385,248 410,248 410,260" fill="#27ae60" opacity="0.7"/>

  <!-- ===== RIGHT COLUMN: 3.6+ ===== -->
  <rect x="460" y="55" width="270" height="390" rx="8" fill="#f0faf0" stroke="#e0e0e0" stroke-width="1"/>
  <text x="595" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#27ae60">Debezium 3.6</text>
  <text x="595" y="99" text-anchor="middle" font-size="11" fill="#7f8c8d">Single intuitive property</text>

  <!-- Single property box -->
  <rect x="485" y="220" width="240" height="50" rx="8" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="2"/>
  <text x="605" y="242" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">log.mining.log.count.min</text>
  <text x="605" y="260" text-anchor="middle" font-size="11" fill="#27ae60">default: 2</text>

  <!-- Benefits list -->
  <text x="500" y="305" font-size="11" fill="#2c3e50">&#x2713;  Adapts to workload automatically</text>
  <text x="500" y="325" font-size="11" fill="#2c3e50">&#x2713;  Log-file boundaries, not SCN ranges</text>
  <text x="500" y="345" font-size="11" fill="#2c3e50">&#x2713;  No combinatorial tuning</text>
  <text x="500" y="365" font-size="11" fill="#2c3e50">&#x2713;  Predictable behavior at any volume</text>

  <!-- Footer -->
  <text x="380" y="468" text-anchor="middle" font-size="12" fill="#7f8c8d" font-style="italic">9 properties with complex interactions &#x2192; 1 property that just works</text>
</svg>