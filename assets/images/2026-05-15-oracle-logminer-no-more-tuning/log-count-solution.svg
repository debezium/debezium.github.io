<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a085"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" rx="8" fill="#fafafa"/>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1e1e">Log-Count-Based Mining: Natural Adaptation</text>

  <!-- ===== BEHIND: ARCHIVE LOG BATCHING (top half) ===== -->
  <rect x="30" y="50" width="800" height="210" rx="6" fill="#f0faf0" stroke="#e8e8e8" stroke-width="1"/>
  <text x="50" y="74" font-size="14" font-weight="bold" fill="#27ae60">Behind — Mining archive logs (log.mining.log.count.min applies)</text>

  <!-- Timeline -->
  <line x1="60" y1="140" x2="790" y2="140" stroke="#bdc3c7" stroke-width="2"/>

  <!-- Archive log files — dense, large -->
  <g>
    <rect x="80"  y="105" width="38" height="50" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="99"  y="135" text-anchor="middle" font-size="9" fill="#1e8449">Log 1</text>
    <rect x="124" y="100" width="38" height="55" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="143" y="135" text-anchor="middle" font-size="9" fill="#1e8449">Log 2</text>
    <rect x="168" y="98"  width="38" height="57" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="187" y="135" text-anchor="middle" font-size="9" fill="#1e8449">Log 3</text>
    <rect x="212" y="102" width="38" height="53" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="231" y="135" text-anchor="middle" font-size="9" fill="#1e8449">Log 4</text>
    <rect x="256" y="96"  width="38" height="59" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="275" y="135" text-anchor="middle" font-size="9" fill="#1e8449">Log 5</text>
    <rect x="300" y="100" width="38" height="55" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="319" y="135" text-anchor="middle" font-size="9" fill="#1e8449">Log 6</text>
    <rect x="344" y="104" width="38" height="51" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="363" y="135" text-anchor="middle" font-size="9" fill="#1e8449">Log 7</text>
    <rect x="388" y="98"  width="38" height="57" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="407" y="135" text-anchor="middle" font-size="9" fill="#1e8449">Log 8</text>
    <rect x="432" y="101" width="38" height="54" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="451" y="135" text-anchor="middle" font-size="9" fill="#1e8449">Log 9</text>
    <rect x="476" y="97"  width="38" height="58" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="495" y="135" text-anchor="middle" font-size="9" fill="#1e8449">Log 10</text>
    <rect x="520" y="103" width="38" height="52" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="539" y="135" text-anchor="middle" font-size="9" fill="#1e8449">Log 11</text>
    <rect x="564" y="99"  width="38" height="56" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="583" y="135" text-anchor="middle" font-size="9" fill="#1e8449">Log 12</text>
  </g>

  <!-- Mining window — batching min 2 logs per pass -->
  <rect x="76" y="93" width="90" height="62" rx="6" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="121" y="88" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="bold">Pass 1 (2 logs)</text>

  <!-- Arrow showing progression -->
  <line x1="174" y1="165" x2="210" y2="165" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="164" y="93" width="90" height="67" rx="6" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.6"/>
  <text x="209" y="88" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="bold">Pass 2 (2 logs)</text>

  <line x1="262" y1="165" x2="298" y2="165" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="252" y="91" width="90" height="67" rx="6" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.35"/>
  <text x="420" y="168" font-size="11" fill="#27ae60">... batches through archive log backlog</text>

  <!-- Callout -->
  <rect x="60" y="185" width="750" height="44" rx="5" fill="#27ae60" opacity="0.08" stroke="#27ae60" stroke-width="1"/>
  <text x="435" y="203" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">Reads min N archive logs per redo thread per pass</text>
  <text x="435" y="219" text-anchor="middle" font-size="11" fill="#1e8449">Fewer mining sessions, fewer LogMiner start/stop cycles, reduced total read I/O</text>

  <!-- ===== CAUGHT UP: ONLINE REDO STREAMING (bottom half) ===== -->
  <rect x="30" y="275" width="800" height="210" rx="6" fill="#eef9f6" stroke="#e8e8e8" stroke-width="1"/>
  <text x="50" y="299" font-size="14" font-weight="bold" fill="#16a085">Caught up — Mining online redo logs (near real-time)</text>

  <!-- Online redo log representation -->
  <rect x="80" y="330" width="680" height="50" rx="6" fill="#16a085" opacity="0.1" stroke="#16a085" stroke-width="1.5"/>
  <text x="420" y="350" text-anchor="middle" font-size="12" fill="#16a085" font-weight="bold">Online Redo Log</text>
  <text x="420" y="365" text-anchor="middle" font-size="10" fill="#7f8c8d">Active redo log file being written by LGWR</text>

  <!-- Read position marker -->
  <line x1="200" y1="325" x2="200" y2="385" stroke="#16a085" stroke-width="2.5"/>
  <polygon points="195,322 205,322 200,315" fill="#16a085"/>
  <text x="200" y="308" text-anchor="middle" font-size="10" fill="#16a085" font-weight="bold">Read position</text>

  <!-- Last flushed position marker -->
  <line x1="580" y1="325" x2="580" y2="385" stroke="#e67e22" stroke-width="2.5"/>
  <polygon points="575,322 585,322 580,315" fill="#e67e22"/>
  <text x="580" y="308" text-anchor="middle" font-size="10" fill="#e67e22" font-weight="bold">Last flushed</text>

  <!-- Arrow spanning read position to last flushed -->
  <line x1="208" y1="395" x2="572" y2="395" stroke="#16a085" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <line x1="208" y1="395" x2="208" y2="388" stroke="#16a085" stroke-width="2"/>
  <text x="390" y="412" text-anchor="middle" font-size="11" fill="#16a085" font-weight="bold">Mines everything from read position to last flushed event</text>

  <!-- Callout -->
  <rect x="60" y="425" width="750" height="44" rx="5" fill="#16a085" opacity="0.08" stroke="#16a085" stroke-width="1"/>
  <text x="435" y="443" text-anchor="middle" font-size="12" fill="#16a085" font-weight="bold">log.mining.log.count.min does not apply — streams all available changes</text>
  <text x="435" y="459" text-anchor="middle" font-size="11" fill="#0e6655">Near real-time event dispatch with no artificial batching delay</text>

  <!-- Footer note -->
  <text x="430" y="506" text-anchor="middle" font-size="12" fill="#7f8c8d" font-style="italic">Archive logs: batch by count for throughput. Online redo: stream to last flushed for low latency.</text>
</svg>