<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Arial, Helvetica, sans-serif">
  <!-- Background -->
  <rect width="980" height="600" rx="10" fill="#fafafa"/>

  <!-- Title -->
  <text x="490" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e1e1e">Configuration Complexity: Before and After</text>

  <!-- ===== LEFT COLUMN: Pre-3.6 ===== -->
  <rect x="35" y="65" width="420" height="490" rx="10" fill="#fff5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="245" y="98" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">Pre-3.6</text>
  <text x="245" y="120" text-anchor="middle" font-size="14" fill="#7f8c8d">9 interdependent properties</text>

  <!-- Property boxes — batch size group -->
  <text x="60" y="155" font-size="13" fill="#7f8c8d" font-weight="bold">Batch Size</text>
  <rect x="60" y="163" width="375" height="34" rx="5" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="72" y="186" font-size="14" fill="#922b21">log.mining.batch.size.default</text>
  <text x="415" y="186" text-anchor="end" font-size="13" fill="#7f8c8d">20000</text>

  <rect x="60" y="201" width="375" height="34" rx="5" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="72" y="224" font-size="14" fill="#922b21">log.mining.batch.size.min</text>
  <text x="415" y="224" text-anchor="end" font-size="13" fill="#7f8c8d">1000</text>

  <rect x="60" y="239" width="375" height="34" rx="5" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="72" y="262" font-size="14" fill="#922b21">log.mining.batch.size.max</text>
  <text x="415" y="262" text-anchor="end" font-size="13" fill="#7f8c8d">100000</text>

  <!-- Property boxes — sleep time group -->
  <text x="60" y="296" font-size="13" fill="#7f8c8d" font-weight="bold">Sleep Time</text>
  <rect x="60" y="304" width="375" height="34" rx="5" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="72" y="327" font-size="14" fill="#922b21">log.mining.sleep.time.default.ms</text>
  <text x="415" y="327" text-anchor="end" font-size="13" fill="#7f8c8d">1000</text>

  <rect x="60" y="342" width="375" height="34" rx="5" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="72" y="365" font-size="14" fill="#922b21">log.mining.sleep.time.min.ms</text>
  <text x="415" y="365" text-anchor="end" font-size="13" fill="#7f8c8d">0</text>

  <rect x="60" y="380" width="375" height="34" rx="5" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="72" y="403" font-size="14" fill="#922b21">log.mining.sleep.time.max.ms</text>
  <text x="415" y="403" text-anchor="end" font-size="13" fill="#7f8c8d">3000</text>

  <rect x="60" y="418" width="375" height="34" rx="5" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="72" y="441" font-size="14" fill="#922b21">log.mining.sleep.time.increment.ms</text>
  <text x="415" y="441" text-anchor="end" font-size="13" fill="#7f8c8d">200</text>

  <!-- Property boxes — SCN gap group -->
  <text x="60" y="475" font-size="13" fill="#7f8c8d" font-weight="bold">SCN Gap Detection</text>
  <rect x="60" y="483" width="375" height="34" rx="5" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="72" y="506" font-size="13" fill="#922b21">log.mining.scn.gap.detection.gap.size.min</text>
  <text x="415" y="506" text-anchor="end" font-size="13" fill="#7f8c8d">1000000</text>

  <rect x="60" y="521" width="375" height="34" rx="5" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="72" y="543" font-size="12" fill="#922b21">log.mining.scn.gap.detection.time.interval.max.ms</text>
  <text x="415" y="543" text-anchor="end" font-size="13" fill="#7f8c8d">20000</text>

  <!-- Dependency line -->
  <line x1="48" y1="178" x2="48" y2="543" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>
  <text x="44" y="365" text-anchor="middle" font-size="12" fill="#c0392b" transform="rotate(-90, 44, 365)" opacity="0.6">interdependent</text>

  <!-- ===== ARROW ===== -->
  <polygon points="565,305 530,280 530,295 500,295 500,315 530,315 530,330" fill="#27ae60" opacity="0.7"/>

  <!-- ===== RIGHT COLUMN: 3.6+ ===== -->
  <rect x="590" y="65" width="355" height="490" rx="10" fill="#f0faf0" stroke="#e0e0e0" stroke-width="1"/>
  <text x="768" y="98" text-anchor="middle" font-size="20" font-weight="bold" fill="#27ae60">Debezium 3.6</text>
  <text x="768" y="120" text-anchor="middle" font-size="14" fill="#7f8c8d">Single intuitive property</text>

  <!-- Single property box -->
  <rect x="625" y="275" width="285" height="60" rx="10" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="2.5"/>
  <text x="768" y="302" text-anchor="middle" font-size="17" fill="#1e8449" font-weight="bold">log.mining.log.count.min</text>
  <text x="768" y="324" text-anchor="middle" font-size="14" fill="#27ae60">default: 2</text>

  <!-- Benefits list -->
  <text x="640" y="380" font-size="15" fill="#2c3e50">&#x2713;  Adapts to workload automatically</text>
  <text x="640" y="408" font-size="15" fill="#2c3e50">&#x2713;  Log-file boundaries, not SCN ranges</text>
  <text x="640" y="436" font-size="15" fill="#2c3e50">&#x2713;  No combinatorial tuning</text>
  <text x="640" y="464" font-size="15" fill="#2c3e50">&#x2713;  Predictable behavior at any volume</text>

  <!-- Footer -->
  <text x="490" y="585" text-anchor="middle" font-size="16" fill="#7f8c8d" font-style="italic">9 properties with complex interactions &#x2192; 1 property that just works</text>
</svg>