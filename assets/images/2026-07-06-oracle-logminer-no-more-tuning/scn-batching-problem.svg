<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowRed" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#c0392b"/>
    </marker>
    <marker id="arrowGrey" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="660" rx="10" fill="#fafafa"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e1e1e">SCN-Based Batching: The Tuning Dilemma</text>

  <!-- ===== PEAK PERIOD (top half) ===== -->
  <rect x="35" y="60" width="1030" height="270" rx="8" fill="#fff5f5" stroke="#e8e8e8" stroke-width="1"/>
  <text x="60" y="92" font-size="18" font-weight="bold" fill="#c0392b">Peak Period — Nightly batch ETL</text>

  <!-- Timeline -->
  <line x1="70" y1="180" x2="1020" y2="180" stroke="#bdc3c7" stroke-width="2.5"/>

  <!-- Log file rectangles — dense, large -->
  <g>
    <rect x="90"  y="130" width="52" height="65" rx="5" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="116" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Log 1</text>
    <rect x="150" y="124" width="52" height="71" rx="5" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="176" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Log 2</text>
    <rect x="210" y="121" width="52" height="74" rx="5" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="236" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Log 3</text>
    <rect x="270" y="127" width="52" height="68" rx="5" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="296" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Log 4</text>
    <rect x="330" y="118" width="52" height="77" rx="5" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="356" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Log 5</text>
    <rect x="390" y="124" width="52" height="71" rx="5" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="416" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Log 6</text>
    <rect x="450" y="130" width="52" height="65" rx="5" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="476" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Log 7</text>
    <rect x="510" y="121" width="52" height="74" rx="5" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="536" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Log 8</text>
    <rect x="570" y="126" width="52" height="69" rx="5" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="596" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Log 9</text>
    <rect x="630" y="119" width="52" height="76" rx="5" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="656" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Log 10</text>
    <rect x="690" y="128" width="52" height="67" rx="5" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="716" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Log 11</text>
    <rect x="750" y="122" width="52" height="73" rx="5" fill="#e74c3c" opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <text x="776" y="170" text-anchor="middle" font-size="12" fill="#c0392b">Log 12</text>
  </g>

  <!-- SCN range bracket -->
  <line x1="90" y1="215" x2="370" y2="215" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="90" y1="215" x2="90"  y2="200" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="370" y1="215" x2="370" y2="200" stroke="#c0392b" stroke-width="2.5"/>
  <text x="230" y="238" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">SCN range = 1,000,000</text>

  <!-- Callout -->
  <rect x="430" y="205" width="570" height="55" rx="6" fill="#c0392b" opacity="0.1" stroke="#c0392b" stroke-width="1"/>
  <text x="715" y="228" text-anchor="middle" font-size="15" fill="#c0392b" font-weight="bold">SCN window spans 5+ large log files</text>
  <text x="715" y="250" text-anchor="middle" font-size="14" fill="#922b21">Millions of redo entries per pass — connector overwhelmed, excessive I/O</text>

  <!-- Multiple pass arrows -->
  <text x="110" y="300" font-size="13" fill="#7f8c8d">Pass 1</text>
  <line x1="175" y1="296" x2="350" y2="296" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGrey)"/>
  <text x="380" y="300" font-size="13" fill="#7f8c8d">Pass 2</text>
  <line x1="445" y1="296" x2="620" y2="296" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGrey)"/>
  <text x="650" y="300" font-size="13" fill="#7f8c8d">Pass 3</text>
  <line x1="715" y1="296" x2="860" y2="296" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowGrey)"/>
  <text x="890" y="300" font-size="13" fill="#7f8c8d">... N passes</text>

  <!-- ===== QUIET PERIOD (bottom half) ===== -->
  <rect x="35" y="350" width="1030" height="270" rx="8" fill="#f0f4ff" stroke="#e8e8e8" stroke-width="1"/>
  <text x="60" y="382" font-size="18" font-weight="bold" fill="#2c3e50">Quiet Period — Sunday afternoon</text>

  <!-- Timeline -->
  <line x1="70" y1="470" x2="1020" y2="470" stroke="#bdc3c7" stroke-width="2.5"/>

  <!-- Log file rectangles — sparse, small -->
  <g>
    <rect x="120" y="438" width="52" height="40" rx="5" fill="#3498db" opacity="0.2" stroke="#2980b9" stroke-width="1.5"/>
    <text x="146" y="464" text-anchor="middle" font-size="12" fill="#2980b9">Log 1</text>
    <rect x="400" y="443" width="52" height="35" rx="5" fill="#3498db" opacity="0.2" stroke="#2980b9" stroke-width="1.5"/>
    <text x="426" y="464" text-anchor="middle" font-size="12" fill="#2980b9">Log 2</text>
    <rect x="760" y="440" width="52" height="38" rx="5" fill="#3498db" opacity="0.15" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="786" y="464" text-anchor="middle" font-size="12" fill="#2980b9">Log 3</text>
    <text x="786" y="433" text-anchor="middle" font-size="11" fill="#7f8c8d">(partial)</text>
  </g>

  <!-- SCN range bracket — overshooting -->
  <line x1="120" y1="500" x2="920" y2="500" stroke="#e67e22" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="120" y1="500" x2="120" y2="487" stroke="#e67e22" stroke-width="2.5"/>
  <line x1="920" y1="500" x2="920" y2="487" stroke="#e67e22" stroke-width="2.5"/>
  <text x="520" y="524" text-anchor="middle" font-size="15" fill="#e67e22" font-weight="bold">SCN range = 1,000,000 — overshoots available data</text>

  <!-- Callout -->
  <rect x="200" y="540" width="700" height="55" rx="6" fill="#e67e22" opacity="0.1" stroke="#e67e22" stroke-width="1"/>
  <text x="550" y="563" text-anchor="middle" font-size="15" fill="#e67e22" font-weight="bold">Only 2.5 small logs exist in this SCN range</text>
  <text x="550" y="583" text-anchor="middle" font-size="14" fill="#d35400">Wasted reads on empty ranges, unnecessary polling cycles</text>

  <!-- Footer note -->
  <text x="550" y="643" text-anchor="middle" font-size="15" fill="#7f8c8d" font-style="italic">The same SCN range that overwhelms during peak, overshoots during quiet — no single tuning works for both.</text>
</svg>