<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowGreen" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#27ae60"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#16a085"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="660" rx="10" fill="#fafafa"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e1e1e">Log-Count-Based Mining: Natural Adaptation</text>

  <!-- ===== BEHIND: ARCHIVE LOG BATCHING (top half) ===== -->
  <rect x="35" y="60" width="1030" height="270" rx="8" fill="#f0faf0" stroke="#e8e8e8" stroke-width="1"/>
  <text x="60" y="92" font-size="18" font-weight="bold" fill="#27ae60">Behind — Mining archive logs (log.mining.log.count.min applies)</text>

  <!-- Timeline -->
  <line x1="70" y1="180" x2="1020" y2="180" stroke="#bdc3c7" stroke-width="2.5"/>

  <!-- Archive log files — dense, large -->
  <g>
    <rect x="90"  y="130" width="52" height="65" rx="5" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="116" y="170" text-anchor="middle" font-size="12" fill="#1e8449">Log 1</text>
    <rect x="150" y="124" width="52" height="71" rx="5" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="176" y="170" text-anchor="middle" font-size="12" fill="#1e8449">Log 2</text>
    <rect x="210" y="121" width="52" height="74" rx="5" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="236" y="170" text-anchor="middle" font-size="12" fill="#1e8449">Log 3</text>
    <rect x="270" y="127" width="52" height="68" rx="5" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="296" y="170" text-anchor="middle" font-size="12" fill="#1e8449">Log 4</text>
    <rect x="330" y="118" width="52" height="77" rx="5" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="356" y="170" text-anchor="middle" font-size="12" fill="#1e8449">Log 5</text>
    <rect x="390" y="124" width="52" height="71" rx="5" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="416" y="170" text-anchor="middle" font-size="12" fill="#1e8449">Log 6</text>
    <rect x="450" y="130" width="52" height="65" rx="5" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="476" y="170" text-anchor="middle" font-size="12" fill="#1e8449">Log 7</text>
    <rect x="510" y="121" width="52" height="74" rx="5" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="536" y="170" text-anchor="middle" font-size="12" fill="#1e8449">Log 8</text>
    <rect x="570" y="126" width="52" height="69" rx="5" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="596" y="170" text-anchor="middle" font-size="12" fill="#1e8449">Log 9</text>
    <rect x="630" y="119" width="52" height="76" rx="5" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="656" y="170" text-anchor="middle" font-size="12" fill="#1e8449">Log 10</text>
    <rect x="690" y="128" width="52" height="67" rx="5" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="716" y="170" text-anchor="middle" font-size="12" fill="#1e8449">Log 11</text>
    <rect x="750" y="122" width="52" height="73" rx="5" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
    <text x="776" y="170" text-anchor="middle" font-size="12" fill="#1e8449">Log 12</text>
  </g>

  <!-- Mining window — batching min 2 logs per pass -->
  <rect x="85" y="118" width="122" height="78" rx="7" fill="none" stroke="#27ae60" stroke-width="3" stroke-dasharray="7,4"/>
  <text x="146" y="112" text-anchor="middle" font-size="14" fill="#27ae60" font-weight="bold">Pass 1 (2 logs)</text>

  <!-- Arrow showing progression -->
  <line x1="215" y1="210" x2="260" y2="210" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="205" y="115" width="122" height="81" rx="7" fill="none" stroke="#27ae60" stroke-width="3" stroke-dasharray="7,4" opacity="0.55"/>
  <text x="266" y="112" text-anchor="middle" font-size="14" fill="#27ae60" font-weight="bold">Pass 2 (2 logs)</text>

  <line x1="335" y1="210" x2="380" y2="210" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="325" y="112" width="122" height="83" rx="7" fill="none" stroke="#27ae60" stroke-width="3" stroke-dasharray="7,4" opacity="0.3"/>

  <text x="550" y="214" font-size="15" fill="#27ae60">... batches through archive log backlog</text>

  <!-- Callout -->
  <rect x="70" y="240" width="960" height="55" rx="6" fill="#27ae60" opacity="0.08" stroke="#27ae60" stroke-width="1"/>
  <text x="550" y="263" text-anchor="middle" font-size="16" fill="#27ae60" font-weight="bold">Reads min N archive logs per redo thread per pass</text>
  <text x="550" y="283" text-anchor="middle" font-size="14" fill="#1e8449">Fewer mining sessions, fewer LogMiner start/stop cycles, reduced total read I/O</text>

  <!-- ===== CAUGHT UP: ONLINE REDO STREAMING (bottom half) ===== -->
  <rect x="35" y="350" width="1030" height="270" rx="8" fill="#eef9f6" stroke="#e8e8e8" stroke-width="1"/>
  <text x="60" y="382" font-size="18" font-weight="bold" fill="#16a085">Caught up — Mining online redo logs (near real-time)</text>

  <!-- Online redo log representation -->
  <rect x="90" y="420" width="880" height="65" rx="8" fill="#16a085" opacity="0.1" stroke="#16a085" stroke-width="1.5"/>
  <text x="530" y="448" text-anchor="middle" font-size="16" fill="#16a085" font-weight="bold">Online Redo Log</text>
  <text x="530" y="470" text-anchor="middle" font-size="13" fill="#7f8c8d">Active redo log file being written by LGWR</text>

  <!-- Read position marker -->
  <line x1="250" y1="413" x2="250" y2="492" stroke="#16a085" stroke-width="3"/>
  <polygon points="244,410 256,410 250,400" fill="#16a085"/>
  <text x="250" y="392" text-anchor="middle" font-size="14" fill="#16a085" font-weight="bold">Read position</text>

  <!-- Last flushed position marker -->
  <line x1="750" y1="413" x2="750" y2="492" stroke="#e67e22" stroke-width="3"/>
  <polygon points="744,410 756,410 750,400" fill="#e67e22"/>
  <text x="750" y="392" text-anchor="middle" font-size="14" fill="#e67e22" font-weight="bold">Last flushed</text>

  <!-- Arrow spanning read position to last flushed -->
  <line x1="260" y1="505" x2="740" y2="505" stroke="#16a085" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <line x1="260" y1="505" x2="260" y2="496" stroke="#16a085" stroke-width="2.5"/>
  <text x="500" y="528" text-anchor="middle" font-size="15" fill="#16a085" font-weight="bold">Mines everything from read position to last flushed event</text>

  <!-- Callout -->
  <rect x="70" y="545" width="960" height="55" rx="6" fill="#16a085" opacity="0.08" stroke="#16a085" stroke-width="1"/>
  <text x="550" y="568" text-anchor="middle" font-size="16" fill="#16a085" font-weight="bold">log.mining.log.count.min does not apply — streams all available changes</text>
  <text x="550" y="588" text-anchor="middle" font-size="14" fill="#0e6655">Near real-time event dispatch with no artificial batching delay</text>

  <!-- Footer note -->
  <text x="550" y="643" text-anchor="middle" font-size="15" fill="#7f8c8d" font-style="italic">Archive logs: batch by count for throughput. Online redo: stream to last flushed for low latency.</text>
</svg>