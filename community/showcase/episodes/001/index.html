<div class="card accent" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 22px;">

<div style="display:flex;justify-content:center;gap:24px;align-items:flex-start;width:100%;"><div style="display:flex;flex-direction:column;align-items:center;">

<div style="color:var(--dbz-muted);font-size:0.82em;margin:4px 0 14px 0;">Chris is a Software Engineer at IBM, formerly Red Hat, where he focuses on Debezium with a deep specialization in Oracle and Change Data Capture.</div>
</div></div>
<div style="font-size:0.88em;color:var(--dbz-accent-strong);font-weight:600;">What's cooking in Debezium?</div>
