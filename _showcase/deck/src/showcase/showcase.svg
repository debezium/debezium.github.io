<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="mic-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#91D443"/>
      <stop offset="100%" stop-color="#48BFE0"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AAE069" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#48BFE0" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Microphone head -->
  <rect x="160" y="80" width="80" height="120" rx="40" fill="url(#mic-grad)"/>

  <!-- Grille lines -->
  <line x1="175" y1="105" x2="225" y2="105" stroke="#070F16" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="175" y1="120" x2="225" y2="120" stroke="#070F16" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="175" y1="135" x2="225" y2="135" stroke="#070F16" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="175" y1="150" x2="225" y2="150" stroke="#070F16" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="175" y1="165" x2="225" y2="165" stroke="#070F16" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Mic body/stand -->
  <rect x="192" y="200" width="16" height="60" rx="4" fill="#A4B5C1"/>
  <!-- Mic base -->
  <rect x="165" y="255" width="70" height="10" rx="5" fill="#A4B5C1"/>

  <!-- Sound waves left -->
  <path d="M140 110 Q125 140 140 170" fill="none" stroke="url(#wave-grad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M120 95 Q95 140 120 185" fill="none" stroke="url(#wave-grad)" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <path d="M100 80 Q65 140 100 200" fill="none" stroke="url(#wave-grad)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- Sound waves right -->
  <path d="M260 110 Q275 140 260 170" fill="none" stroke="url(#wave-grad)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M280 95 Q305 140 280 185" fill="none" stroke="url(#wave-grad)" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <path d="M300 80 Q335 140 300 200" fill="none" stroke="url(#wave-grad)" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- Community people silhouettes -->
  <!-- Person left -->
  <circle cx="120" cy="300" r="16" fill="#48BFE0" opacity="0.7"/>
  <rect x="104" y="320" width="32" height="35" rx="12" fill="#48BFE0" opacity="0.7"/>

  <!-- Person center-left -->
  <circle cx="170" cy="295" r="18" fill="#91D443" opacity="0.8"/>
  <rect x="152" y="317" width="36" height="38" rx="14" fill="#91D443" opacity="0.8"/>

  <!-- Person center -->
  <circle cx="200" cy="310" r="14" fill="#6FD3EC" opacity="0.6"/>
  <rect x="186" y="328" width="28" height="30" rx="10" fill="#6FD3EC" opacity="0.6"/>

  <!-- Person center-right -->
  <circle cx="235" cy="293" r="18" fill="#AAE069" opacity="0.75"/>
  <rect x="217" y="315" width="36" height="38" rx="14" fill="#AAE069" opacity="0.75"/>

  <!-- Person right -->
  <circle cx="285" cy="302" r="16" fill="#F0A828" opacity="0.65"/>
  <rect x="269" y="322" width="32" height="35" rx="12" fill="#F0A828" opacity="0.65"/>
</svg>
